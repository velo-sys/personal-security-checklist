- title: Computer
  slug: personal-computers
  description: Betriebssystem, Daten und Aktivitäten am PC schützen
  icon: computer
  intro: >
    Windows und macOS sind bequem, aber weit davon entfernt, privat zu sein: Ab Windows 8.1 gibt es eine
    Werbe-ID, und beide Systeme senden Nutzungsdaten an den Hersteller. Das Betriebssystem ist die
    Schnittstelle zwischen Hardware und Programmen – ist es kompromittiert, hat das weitreichende Folgen.
  checklist:
  - id: keep-your-system-up-to-date
    point: System aktuell halten
    priority: Essential
    details: >-
      Updates schließen Sicherheitslücken, verbessern die Leistung und bringen manchmal neue Funktionen.
      Installieren Sie sie zeitnah.

  - id: pc-encrypt-your-device
    point: Gerät verschlüsseln
    priority: Essential
    details: >-
      Nutzen Sie BitLocker (Windows), FileVault (macOS) oder LUKS (Linux) für eine vollständige
      Festplattenverschlüsselung. So sind Ihre Daten bei Verlust oder Diebstahl geschützt. Den
      Wiederherstellungsschlüssel sicher aufbewahren!

  - id: backup-important-data
    point: Wichtige Daten sichern
    priority: Essential
    details: >-
      Verschlüsselte Backups schützen vor Verlust durch Erpressungssoftware, Diebstahl oder Defekt (Faustregel
      3-2-1: drei Kopien, zwei Medien, eine außer Haus). Für Cloud-Dateien eignet sich
      [Cryptomator](https://awesome-privacy.xyz/security-tools/mobile-apps/cryptomator) (aus Bonn), für
      USB-Laufwerke [VeraCrypt](https://awesome-privacy.xyz/essentials/file-encryption/veracrypt).

  - id: be-careful-plugging-usb-devices-into-your-computer
    point: Vorsicht beim Anschließen von USB-Geräten
    priority: Essential
    details: >-
      USB-Geräte können eine ernste Gefahr sein. Stecken Sie keine gefundenen USB-Sticks ein. Fremde Sticks
      lassen sich z. B. mit CIRCLean auf einem separaten Gerät prüfen.

  - id: activate-screen-lock-when-idle
    point: Bildschirmsperre bei Inaktivität
    priority: Essential
    details: >-
      Sperren Sie den Computer, wenn Sie weggehen (Windows+L), und verlangen Sie nach Bildschirmschoner oder
      Ruhezustand ein Passwort.

  - id: disable-cortana-or-siri
    point: Sprachassistenten deaktivieren
    priority: Essential
    details: >-
      Sprachassistenten wie Cortana, Copilot oder Siri senden Daten zur Verarbeitung an den Hersteller.
      Deaktivieren oder begrenzen Sie sie.

  - id: review-your-installed-apps
    point: Installierte Programme prüfen
    priority: Essential
    details: >-
      Halten Sie die Zahl installierter Programme gering, um weniger Schwachstellen zu haben, und entfernen
      Sie regelmäßig, was Sie nicht mehr brauchen.

  - id: manage-permissions
    point: Berechtigungen verwalten
    priority: Essential
    details: >-
      Legen Sie fest, welche Programme Zugriff auf Standort, Kamera, Mikrofon, Kontakte und andere sensible
      Daten haben.

  - id: disallow-usage-data-from-being-sent-to-the-cloud
    point: Nutzungsdaten nicht in die Cloud senden
    priority: Essential
    details: >-
      Begrenzen Sie Diagnose- und Nutzungsdaten, die an den Hersteller gehen. Unter Windows: Einstellungen ›
      Datenschutz und Sicherheit › Diagnose & Feedback und › Allgemein (Werbe-ID deaktivieren).

  - id: avoid-quick-unlock
    point: Schnell-Entsperren meiden
    priority: Essential
    details: >-
      Ein starkes Passwort ist sicherer als Biometrie oder eine kurze PIN zum Entsperren des Computers.

  - id: power-off-computer,-instead-of-standby
    point: Ausschalten statt Standby
    priority: Essential
    details: >-
      Fahren Sie das Gerät herunter, wenn Sie es nicht nutzen – besonders bei verschlüsselter Festplatte,
      denn nur im ausgeschalteten Zustand sind die Daten wirklich verschlossen.

  - id: don't-link-your-pc-with-your-microsoft-or-apple-account
    point: PC nicht mit Microsoft- oder Apple-Konto verknüpfen
    priority: Optional
    details: >-
      Nutzen Sie nach Möglichkeit ein lokales Konto, um Synchronisierung und Datenabfluss zu vermeiden.

  - id: check-which-sharing-services-are-enabled
    point: Freigabedienste prüfen
    priority: Optional
    details: >-
      Deaktivieren Sie Netzwerkfreigaben, die Sie nicht nutzen, um gängige Angriffswege zu schließen.

  - id: don't-use-root/admin-account-for-non-admin-tasks
    point: Kein Admin-Konto für den Alltag
    priority: Optional
    details: >-
      Arbeiten Sie im Alltag mit einem Standardkonto und nutzen Sie Administratorrechte nur für Änderungen
      am System. So richtet Schadsoftware weniger Schaden an.

  - id: block-webcam-+-microphone
    point: Webcam und Mikrofon abdecken
    priority: Optional
    details: >-
      Decken Sie die Webcam ab, wenn Sie sie nicht nutzen, und verhindern Sie unerlaubte Tonaufnahmen.

  - id: use-a-privacy-filter
    point: Blickschutzfilter nutzen
    priority: Optional
    details: >-
      Ein Blickschutzfilter am Bildschirm verhindert in der Öffentlichkeit, dass jemand mitliest.

  - id: physically-secure-device
    point: Gerät physisch sichern
    priority: Optional
    details: >-
      Sichern Sie den Laptop in der Öffentlichkeit mit einem Kensington-Schloss und erwägen Sie
      Anschluss-Sperren gegen unbefugten physischen Zugriff.

  - id: don't-charge-devices-from-your-pc
    point: Geräte nicht am PC laden
    priority: Optional
    details: >-
      Laden Sie Handy & Co. lieber an Netzteil oder Powerbank als am PC, um USB-bezogene Risiken zu vermeiden.

  - id: randomize-your-hardware-address-on-wi-fi
    point: Zufällige Hardware-Adresse im WLAN
    priority: Optional
    details: >-
      Aktivieren Sie zufällige MAC-Adressen, damit Sie nicht über verschiedene WLANs hinweg verfolgt werden
      können (Windows: „Zufällige Hardwareadressen“; Android/iOS: „Private Adresse“).

  - id: use-a-firewall
    point: Firewall nutzen
    priority: Optional
    details: >-
      Eine Firewall-Anwendung zeigt und blockiert unerwünschte Internetzugriffe einzelner Programme
      (z. B. Portmaster, Little Snitch, OpenSnitch).

  - id: protect-against-software-keyloggers
    point: Vor Software-Keyloggern schützen
    priority: Optional
    details: >-
      Software-Keylogger zeichnen Ihre Tastenanschläge auf. Halten Sie das System sauber und nutzen Sie das
      automatische Ausfüllen des Passwortmanagers statt zu tippen.

  - id: check-keyboard-connection
    point: Tastaturanschluss prüfen
    priority: Optional
    details: >-
      Achten Sie an öffentlichen oder fremden Computern auf Hardware-Keylogger zwischen Tastatur und Rechner.

  - id: prevent-keystroke-injection-attacks
    point: Tastatureingabe-Angriffe verhindern
    priority: Optional
    details: >-
      Als Tastatur getarnte USB-Geräte können in Sekunden Befehle eingeben. Sperren Sie den PC beim Weggehen
      und nutzen Sie ggf. USBGuard o. Ä.

  - id: don't-use-commercial-"free"-anti-virus
    point: Keine kommerziellen „Gratis“-Virenscanner
    priority: Optional
    details: >-
      Verlassen Sie sich auf die eingebauten Schutzfunktionen (z. B. Microsoft Defender). Gratis-Virenscanner
      sammeln oft Daten und finanzieren sich darüber.

  - id: periodically-check-for-rootkits
    point: Regelmäßig auf Rootkits prüfen
    priority: Advanced
    details: >-
      Prüfen Sie regelmäßig auf Rootkits, die die volle Kontrolle über das System erlangen, z. B. mit
      [chkrootkit](https://awesome-privacy.xyz/operating-systems/linux-defenses/chkrootkit).

  - id: bios-boot-password
    point: BIOS-/UEFI-Passwort
    priority: Advanced
    details: >-
      Ein BIOS- oder UEFI-Passwort ist eine zusätzliche Hürde beim Starten – hat aber Grenzen.

  - id: use-a-security-focused-operating-system
    point: Sicherheitsorientiertes Betriebssystem nutzen
    priority: Advanced
    details: >-
      Erwägen Sie den Umstieg auf Linux oder ein sicherheitsorientiertes System wie Qubes OS oder
      [Tails](https://awesome-privacy.xyz/operating-systems/desktop-operating-systems/tails).

  - id: make-use-of-vms
    point: Virtuelle Maschinen nutzen
    priority: Advanced
    details: >-
      Nutzen Sie virtuelle Maschinen für riskante Tätigkeiten oder zum Testen verdächtiger Software, um
      Ihr Hauptsystem zu schützen.

  - id: compartmentalize
    point: Bereiche trennen
    priority: Advanced
    details: >-
      Trennen Sie Programme und Datenquellen so weit wie möglich voneinander, um den Schaden bei einem
      Einbruch zu begrenzen.

  - id: disable-undesired-features-(windows)
    point: Unerwünschte Funktionen deaktivieren (Windows)
    priority: Advanced
    details: >-
      Deaktivieren Sie unnötige Windows-„Funktionen“ und Hintergrunddienste, um Datensammlung und
      Ressourcenverbrauch zu senken (z. B. mit O&O ShutUp10++).

  - id: secure-boot
    point: Secure Boot
    priority: Advanced
    details: >-
      Lassen Sie Secure Boot aktiviert, damit Schadsoftware den Bootloader nicht austauschen kann.

  - id: secure-ssh-access
    point: SSH-Zugang absichern
    priority: Advanced
    details: >-
      Schützen Sie SSH mit Schlüsseln statt Passwörtern, deaktivieren Sie Root-Login und begrenzen Sie den
      Zugriff per Firewall.

  - id: close-un-used-open-ports
    point: Ungenutzte offene Ports schließen
    priority: Advanced
    details: >-
      Schalten Sie Dienste ab, die auf externen Ports lauschen und nicht gebraucht werden.

  - id: implement-mandatory-access-control
    point: Mandatory Access Control einsetzen
    priority: Advanced
    details: >-
      Schränken Sie privilegierte Zugriffe ein (z. B. SELinux, AppArmor), um den Schaden bei einer
      Kompromittierung zu begrenzen.

  - id: use-canary-tokens
    point: Canary Tokens nutzen
    priority: Advanced
    details: >-
      [Canary Tokens](https://canarytokens.org) sind Köder-Dateien oder -Adressen, die Alarm schlagen, sobald
      jemand unbefugt darauf zugreift.

  - id: keep-sensitive-data-out-of-cloud-ai
    point: Keine sensiblen Daten in Cloud-KI eingeben
    priority: Essential
    details: >-
      Cloud-KI-Dienste (ChatGPT, Gemini, Claude & Co.) sehen alles, was Sie
      eingeben. Eingaben werden gespeichert, je nach Einstellung auch fürs Training genutzt, und sind mit
      Konto, Zahlungsdaten und IP-Adresse verknüpft; die Server stehen überwiegend in den USA. Gesundheitsdaten,
      Passwörter, Kundendaten und Ausweisdaten gehören nie in eine Cloud-KI. Prüfen Sie außerdem in den
      Einstellungen, ob Ihre Chats zum Training verwendet werden dürfen.

  - id: consider-running-ai-locally
    point: KI lokal betreiben erwägen
    priority: Advanced
    details: >-
      Mit [Ollama](https://ollama.com) (Windows, macOS, Linux) laufen Sprachmodelle direkt
      auf Ihrem Rechner – Ihre Daten verlassen das Gerät nicht. Für 7B/8B-Modelle brauchen Sie etwa 8 GB
      Grafikkartenspeicher (VRAM). Lokale Modelle sind deutlich schwächer als große Cloud-Modelle (kleineres
      Kontextfenster, oft nur Text), dafür bleiben die Daten bei Ihnen.

  - id: reduce-dependence-on-big-tech-clouds
    point: Abhängigkeit von Google-/Apple-Cloud verringern
    priority: Optional
    details: >-
      Android drängt auf Google Drive, iOS auf iCloud. Inhalte werden dort
      maschinell ausgewertet (z. B. Objekte, Orte und Gesichter in Fotos), US-Behörden können über den CLOUD
      Act auch auf Daten in EU-Rechenzentren zugreifen, und eine Kontosperrung bedeutet den Verlust von Mails,
      Fotos und Kontakten. Quelloffene Alternative: [Nextcloud](https://nextcloud.com/de/) für Dateien,
      Fotos, Kontakte und Kalender – selbst gehostet (volle Kontrolle, aber Sie sind für Updates, Backups
      nach der 3-2-1-Regel und sicheren Fernzugriff per VPN statt offener Ports verantwortlich) oder bei einem
      deutschen Anbieter. Merksatz: Mehr Kontrolle heißt mehr Eigenverantwortung.
