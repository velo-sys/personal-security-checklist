- title: Faktor Mensch
  slug: human-aspect
  description: Social Engineering erkennen und abwehren
  icon: human
  intro: >-
    Viele Datenlecks, Hacks und Angriffe entstehen durch menschliche Fehler. Oder kurz: Sie werden nicht
    gehackt, Sie werden überredet. Phishing kommt per E-Mail, SMS, WhatsApp, Telegram, QR-Code, Anruf,
    Brief oder im persönlichen Gespräch – und mit KI werden Texte, Stimmen und Bilder immer überzeugender.
    Die folgenden Punkte helfen, das Risiko zu senken. Vieles ist gesunder Menschenverstand, aber es lohnt
    sich, es bewusst zu machen.
  checklist:
  - id: verify-recipients
    point: Absender überprüfen
    priority: Essential
    details: >-
      Absender lassen sich leicht fälschen. Prüfen Sie die Echtheit besonders bei heiklen Aktionen und geben
      Sie Adressen lieber selbst ein, statt Links in E-Mails anzuklicken. Im Zweifel nehmen Sie über einen
      bekannten Weg (Telefonnummer aus dem Vertrag, offizielle Website) Kontakt mit dem vermeintlichen
      Absender auf.

  - id: don't-trust-your-popup-notifications
    point: Pop-up-Meldungen nicht trauen
    priority: Essential
    details: >-
      Angreifer nutzen gefälschte Pop-ups („Ihr PC ist infiziert – rufen Sie den Microsoft-Support an“).
      Prüfen Sie immer die Adresse, bevor Sie etwas eingeben, und rufen Sie keine angezeigten Nummern an.

  - id: never-leave-device-unattended
    point: Geräte nie unbeaufsichtigt lassen
    priority: Essential
    details: >-
      Unbeaufsichtigte Geräte können trotz starker Passwörter kompromittiert werden. Nutzen Sie
      Verschlüsselung und Fernlöschung (z. B. „Mein Gerät finden“).

  - id: prevent-camfecting
    point: Webcam-Übernahme verhindern
    priority: Essential
    details: >-
      Schützen Sie sich mit Webcam-Abdeckungen. Schalten Sie Sprachassistenten stumm, wenn Sie sie nicht
      nutzen oder Vertrauliches besprechen.

  - id: stay-protected-from-shoulder-surfers
    point: Vor Schulterblicken schützen
    priority: Essential
    details: >-
      Nutzen Sie in der Öffentlichkeit Blickschutzfilter für Laptop und Handy, damit niemand mitliest.

  - id: educate-yourself-about-phishing-attacks
    point: Über Phishing informieren
    priority: Essential
    details: >-
      Seien Sie wachsam. Checkliste bei verdächtigen Nachrichten: **Ruhe bewahren** (Zeitdruck ist ein
      Warnsignal), **Absender prüfen**, **Links prüfen** (entscheidend ist der Teil direkt vor dem ersten
      `/`; Vorsicht bei Tricks wie `paypaI.com` mit großem i), **keine Dateianhänge öffnen** und **mit dem
      vermeintlichen Absender über einen bekannten Weg Kontakt aufnehmen**. Dazu: 2FA nutzen und Passwörter
      nicht wiederverwenden. Aktuelle Warnungen gibt es beim
      [Phishing-Radar der Verbraucherzentrale](https://www.verbraucherzentrale.de/wissen/digitale-welt/phishingradar).

  - id: human-watch-out-for-stalkerware
    point: Auf Stalkerware achten
    priority: Essential
    details: >-
      Stalkerware wird von Bekannten zum Ausspionieren installiert. Anzeichen sind z. B. ungewöhnlicher
      Akkuverbrauch. Im Verdachtsfall auf Werkseinstellungen zurücksetzen und Hilfe suchen.

  - id: install-reputable-software-from-trusted-sources
    point: Software nur aus vertrauenswürdigen Quellen
    priority: Essential
    details: >-
      Laden Sie Software nur von der offiziellen Herstellerseite oder aus offiziellen Stores herunter und
      prüfen Sie Dateien vor der Installation mit
      [VirusTotal](https://awesome-privacy.xyz/security-tools/online-tools/virus-total).

  - id: store-personal-data-securely
    point: Persönliche Daten sicher speichern
    priority: Essential
    details: >-
      Sorgen Sie dafür, dass persönliche Daten auf Geräten und in der Cloud verschlüsselt sind.

  - id: obscure-personal-details-from-documents
    point: Persönliche Angaben in Dokumenten schwärzen
    priority: Essential
    details: >-
      Schwärzen Sie beim Teilen von Dokumenten (z. B. Ausweiskopien) persönliche Angaben mit
      undurchsichtigen Rechtecken – keine durchscheinenden Marker oder Weichzeichner.

  - id: do-not-assume-a-site-is-secure,-just-because-it-is-`https`
    point: HTTPS heißt nicht „sicher“
    priority: Essential
    details: >-
      HTTPS (das Schloss) bedeutet nur eine verschlüsselte Verbindung, nicht, dass die Seite echt ist.
      Auch Phishing-Seiten nutzen HTTPS. Prüfen Sie die Adresse und seien Sie vorsichtig mit persönlichen
      Daten.

  - id: use-virtual-cards-when-paying-online
    point: Online mit virtuellen Karten zahlen
    priority: Optional
    details: >-
      Virtuelle Karten schützen Ihre Bankdaten bei Online-Zahlungen und begrenzen das Risiko.

  - id: review-application-permissions
    point: App-Berechtigungen prüfen
    priority: Optional
    details: >-
      Prüfen Sie regelmäßig die Berechtigungen Ihrer Apps, damit keine unnötig auf sensible Funktionen
      zugreift.

  - id: opt-out-of-public-lists
    point: Aus öffentlichen Listen austragen
    priority: Optional
    details: >-
      Lassen Sie sich aus öffentlichen Verzeichnissen (Telefonbuch, Das Örtliche) und Werbelisten austragen
      und tragen Sie sich in die [Robinsonliste](https://www.robinsonliste.de) ein.

  - id: never-provide-additional-pii-when-opting-out
    point: Beim Austragen keine zusätzlichen Daten angeben
    priority: Optional
    details: >-
      Geben Sie beim Widerspruch gegen Datennutzung keine zusätzlichen persönlichen Daten an.

  - id: opt-out-of-data-sharing
    point: Datenweitergabe widersprechen
    priority: Optional
    details: >-
      Viele Apps und Dienste teilen standardmäßig Daten. Widersprechen Sie, um die Weitergabe an Dritte zu
      verhindern (Recht nach DSGVO).

  - id: review-and-update-social-media-privacy
    point: Social-Media-Privatsphäre regelmäßig prüfen
    priority: Optional
    details: >-
      Prüfen Sie Ihre Social-Media-Einstellungen regelmäßig, denn geänderte Nutzungsbedingungen können sie
      beeinflussen.

  - id: human-compartmentalize
    point: Bereiche trennen
    priority: Advanced
    details: >-
      Trennen Sie verschiedene Bereiche Ihrer digitalen Aktivität, um bei einem Leck weniger preiszugeben.

  - id: whois-privacy-guard
    point: WHOIS-Datenschutz
    priority: Advanced
    details: >-
      Nutzen Sie bei der Registrierung von Domains den WHOIS-Datenschutz, damit Ihre Daten nicht öffentlich
      abrufbar sind.

  - id: use-a-forwarding-address
    point: Weiterleitungsadresse nutzen
    priority: Advanced
    details: >-
      Nutzen Sie ein Postfach oder eine Weiterleitungsadresse, damit Firmen Ihre echte Adresse nicht kennen.

  - id: use-anonymous-payment-methods
    point: Anonyme Zahlungsmethoden nutzen
    priority: Advanced
    details: >-
      Nutzen Sie anonyme Zahlungsmethoden (z. B. Prepaid-Karten, Bargeld), um online keine identifizierbaren
      Daten anzugeben.

  - id: check-suspicious-links-before-clicking
    point: Verdächtige Links vor dem Klick prüfen
    priority: Essential
    details: >-
      Typische Fallen: `sparkasse.de.sicherheit-kunden.com/login` und `www.postbank.de.verify-id.top`
      (die echte Domain steht direkt vor dem ersten Schrägstrich), `sparkasse-sicherheit.de` (klingt echt,
      ist es nicht), Kurzlinks wie bit.ly und `paypaI.com` mit großem i. Prüfen können Sie Adressen mit
      [VirusTotal](https://www.virustotal.com), [urlscan.io](https://urlscan.io) (zeigt Screenshot,
      echtes Ziel und Weiterleitungen, löst Kurzlinks auf),
      [Google Safe Browsing](https://transparencyreport.google.com/safe-browsing/search), dem
      [Fakeshop-Finder](https://www.verbraucherzentrale.de/fakeshopfinder-71560) und
      [Punycoder](https://www.punycoder.com) (macht getarnte Buchstaben sichtbar).

  - id: be-aware-of-ai-scams
    point: KI-Betrug kennen
    priority: Essential
    details: >-
      Mit KI lassen sich fehlerfreie Phishing-Mails, gefälschte Bilder und sogar Stimmen bekannter Personen
      erzeugen. Rechtschreibfehler sind kein verlässliches Warnsignal mehr. Vereinbaren Sie in der Familie
      ein Codewort für Notfälle und rufen Sie bei Geldforderungen immer über die Ihnen bekannte Nummer zurück.
  color: indigo

- title: Physische Sicherheit
  slug: physical-security
  description: Sicherheitsvorfälle im echten Leben verhindern
  icon: physical
  intro: >-
    Öffentliche Register und Datenbanken enthalten oft sensible Daten (Name, Geburtsdatum, Telefonnummer,
    E-Mail, Adresse …) aus vielen Quellen. Diese Informationen sind teils
    [leicht und legal zugänglich](https://www.consumerreports.org/consumerist/its-creepy-but-not-illegal-for-this-website-to-provide-all-your-public-info-to-anyone/),
    was [ernste Datenschutzprobleme](https://privacyrights.org/resources/public-records-internet-privacy-dilemma)
    mit sich bringt (Identitätsdiebstahl, Stalking, Rufschädigung). In Deutschland können Sie z. B. beim
    Melderegister eine Auskunftssperre bzw. einen Widerspruch gegen Datenweitergabe einlegen.


    Videoüberwachung ist einer der wichtigsten Wege, wie Firmen, Privatpersonen und Staaten Bewegungen
    verfolgen – zunehmend mit Gesichtserkennung.


    Starke Passwörter, verschlüsselte Geräte und anonymes Surfen nützen wenig, wenn jemand physischen
    Zugriff auf Sie, Ihre Geräte oder Ihre Daten bekommt. Dieser Bereich zeigt grundlegende Maßnahmen.
  checklist:
  - id: destroy-sensitive-documents
    point: Sensible Dokumente vernichten
    priority: Essential
    details: |
      Schreddern oder schwärzen Sie sensible Dokumente vor dem Entsorgen, um Identitätsdiebstahl
      vorzubeugen.

  - id: opt-out-of-public-records
    point: Aus öffentlichen Verzeichnissen austragen
    priority: Essential
    details: |
      Lassen Sie sich aus Personensuchmaschinen und Verzeichnissen austragen (Auskunfts- und
      Löschrecht nach DSGVO). Suchen Sie dazu regelmäßig nach Ihrem Namen, Ihrer Adresse und
      E-Mail-Adresse, z. B. bei Google und DuckDuckGo.

  - id: watermark-documents
    point: Dokumente mit Wasserzeichen versehen
    priority: Essential
    details: |
      Versehen Sie digitale Kopien persönlicher Dokumente (z. B. Ausweiskopie) mit einem Wasserzeichen
      mit Empfänger, Zweck und Datum – so ist Missbrauch erschwert und ein Leck nachvollziehbar.

  - id: don't-reveal-info-on-inbound-calls
    point: Bei eingehenden Anrufen nichts preisgeben
    priority: Essential
    details: |
      Geben Sie persönliche Daten nur bei Anrufen preis, die Sie selbst begonnen haben, und prüfen Sie
      die Nummer. Echte Banken und Behörden fragen nie nach PIN, TAN oder Passwort.

  - id: stay-alert
    point: Aufmerksam bleiben
    priority: Essential
    details: Achten Sie auf Ihre Umgebung und schätzen Sie Risiken an neuen Orten ein.

  - id: secure-perimeter
    point: Umgebung sichern
    priority: Essential
    details: Sichern Sie Orte, an denen Geräte mit persönlichen Daten liegen, und begrenzen Sie den Zugang.

  - id: physically-secure-devices
    point: Geräte physisch sichern
    priority: Essential
    details: Nutzen Sie Kensington-Schlösser, Webcam-Abdeckungen und Blickschutzfilter.

  - id: keep-devices-out-of-direct-sight
    point: Geräte nicht sichtbar liegen lassen
    priority: Essential
    details: Geräte sollten von außen (Fenster, Auto) nicht sichtbar sein – das senkt das Diebstahlrisiko.

  - id: protect-your-pin
    point: PIN schützen
    priority: Essential
    details: Verdecken Sie die PIN-Eingabe vor Blicken und Kameras und wischen Sie Touchscreens nach der Nutzung ab.

  - id: check-for-skimmers
    point: Auf Skimmer achten
    priority: Essential
    details: Prüfen Sie Geldautomaten und Kartenterminals vor der Nutzung auf Aufsätze und Manipulationsspuren.

  - id: protect-your-home-address
    point: Wohnadresse schützen
    priority: Optional
    details: Nutzen Sie Abholstationen, Weiterleitungsadressen und anonyme Zahlungsmethoden, um Ihre Adresse zu schützen.

  - id: use-a-portable-door-lock-when-travelling
    point: Auf Reisen ein mobiles Türschloss nutzen
    priority: Optional
    details: Andere könnten Schlüssel zu Ihrem Hotelzimmer haben. Ein mobiles Türschloss oder ein Türalarm ist günstig und erschwert unbemerktes Eindringen.

  - id: use-a-pin,-not-biometrics
    point: PIN statt Biometrie
    priority: Advanced
    details: Bevorzugen Sie eine PIN statt Fingerabdruck oder Gesicht, wenn Sie gezwungen werden könnten, das Gerät zu entsperren.

  - id: reduce-exposure-to-cctv
    point: Videoüberwachung meiden
    priority: Advanced
    details: Wählen Sie Wege mit weniger Kameras, um Überwachung zu reduzieren.

  - id: anti-facial-recognition-clothing
    point: Kleidung gegen Gesichtserkennung
    priority: Advanced
    details: Kleidung mit bestimmten Mustern kann Gesichtserkennung austricksen.

  - id: reduce-night-vision-exposure
    point: Nachtsichtkameras erschweren
    priority: Advanced
    details: Infrarot-Lichtquellen oder reflektierende Brillen stören Nachtsichtkameras.

  - id: protect-your-dna
    point: Ihre DNA schützen
    priority: Advanced
    details: Geben Sie Ihre DNA nicht an Ahnenforschungs-Websites und achten Sie auf DNA-Spuren.
  color: lime
