- title: Anmeldung & Passwörter
  slug: authentication
  description: Zugangsdaten für Ihre Online-Konten absichern
  icon: password
  color: yellow
  intro: >-
    Die meisten gemeldeten Datenlecks entstehen durch schwache, voreingestellte oder gestohlene Passwörter
    (laut [diesem Verizon-Bericht](https://www.verizon.com/business/resources/2016/DBIR_2016_Report.pdf)).
    Verwenden Sie lange, starke und einzigartige Passwörter, verwalten Sie sie in einem sicheren Passwortmanager,
    aktivieren Sie die Zwei-Faktor-Authentifizierung, behalten Sie Datenlecks im Blick und seien Sie
    beim Anmelden aufmerksam.
  checklist:
  - id: use-a-strong-password
    point: Starkes Passwort verwenden
    priority: Essential
    details: >-
      Ist Ihr Passwort zu kurz oder enthält es Wörter aus dem Wörterbuch, Orte oder Namen, kann es leicht
      durch Durchprobieren geknackt oder erraten werden. Am einfachsten wird ein Passwort stark, indem es
      lang ist (12+ Zeichen) – etwa als „Passphrase“ aus mehreren Wörtern. Alternativ erzeugt ein
      Passwortgenerator ein langes, zufälliges Passwort. Mit
      [Security.org – How Secure Is My Password?](https://security.org/how-secure-is-my-password/) sehen Sie,
      wie schnell gängige Passwörter geknackt werden. Mehr zum Thema:
      [BSI – Sichere Passwörter erstellen](https://www.bsi.bund.de/DE/Themen/Verbraucherinnen-und-Verbraucher/Informationen-und-Empfehlungen/Cyber-Sicherheitsempfehlungen/Accountschutz/Sichere-Passwoerter-erstellen/sichere-passwoerter-erstellen_node.html)
      und [securityinabox.org](https://securityinabox.org/en/passwords/passwords/).

  - id: don't-reuse-passwords
    point: Passwörter nicht wiederverwenden
    priority: Essential
    details: >-
      Wer ein Passwort mehrfach nutzt und bei einem Dienst ein Datenleck passiert, gibt Kriminellen den
      Schlüssel zu weiteren Konten. Das geschieht meist durch massenhaft automatisierte Anmeldeversuche
      (Credential Stuffing): Aus einem Leck wird Ihre Kombination automatisch bei hunderten anderen Diensten
      ausprobiert. Der Schutz ist einfach – für jedes Online-Konto ein eigenes Passwort.

  - id: use-a-secure-password-manager
    point: Sicheren Passwortmanager nutzen
    priority: Essential
    details: >-
      Hunderte starke, einzigartige Passwörter kann sich kaum jemand merken. Ein Passwortmanager erzeugt,
      speichert und füllt Ihre Zugangsdaten automatisch aus. Alle Passwörter werden mit einem Master-Passwort
      verschlüsselt (das Sie sich merken müssen und das sehr stark sein sollte). Die meisten Passwortmanager
      haben Browser-Erweiterungen und Apps, sodass Ihre Passwörter auf jedem Gerät verfügbar sind. Ein guter
      Allrounder ist [Bitwarden](https://awesome-privacy.xyz/essentials/password-managers/bitwarden); offline
      und kostenlos funktioniert [KeePassXC](https://keepassxc.org) (siehe auch
      [Empfohlene Passwortmanager](https://awesome-privacy.xyz/essentials/password-managers)).

  - id: avoid-sharing-passwords
    point: Passwörter nicht weitergeben
    priority: Essential
    details: >-
      Manchmal muss man den Zugang zu einem Konto mit jemandem teilen – grundsätzlich sollten Sie das aber
      vermeiden, denn jedes geteilte Passwort erhöht das Risiko. Ist es unumgänglich (z. B. ein gemeinsames
      Team-Konto), nutzen Sie die Freigabefunktionen eines Passwortmanagers.

  - id: enable-2-factor-authentication
    point: Zwei-Faktor-Authentifizierung aktivieren
    priority: Essential
    details: >-
      Bei 2FA brauchen Sie zur Anmeldung etwas, das Sie wissen (Passwort), und etwas, das Sie besitzen (z. B.
      einen Code auf dem Handy). Selbst wer Ihr Passwort hat (durch Phishing, Schadsoftware oder ein Datenleck),
      kommt so nicht in Ihr Konto. Der Einstieg ist einfach: Laden Sie eine
      [Authenticator-App](https://github.com/Lissy93/awesome-privacy#2-factor-authentication) herunter, öffnen
      Sie die Sicherheitseinstellungen Ihres Kontos und folgen Sie den Schritten. Bei der nächsten Anmeldung
      auf einem neuen Gerät werden Sie nach dem Code aus der App gefragt (funktioniert ohne Internet, der Code
      wechselt meist alle 30 Sekunden).

  - id: keep-backup-codes-safe
    point: Wiederherstellungscodes sicher aufbewahren
    priority: Essential
    details: >-
      Beim Einrichten der Mehr-Faktor-Authentifizierung erhalten Sie meist mehrere Notfallcodes für den Fall,
      dass Ihr zweiter Faktor verloren geht oder defekt ist. Bewahren Sie diese sicher auf – auf Papier oder
      an einem sicheren Ort (z. B. offline oder in einer verschlüsselten Datei). Speichern Sie sie nicht im
      Passwortmanager, denn zweiter Faktor und Passwörter sollten getrennt bleiben.

  - id: sign-up-for-breach-alerts
    point: Benachrichtigungen bei Datenlecks einrichten
    priority: Optional
    details: >-
      Nach einem großen Datenleck landen die Daten oft im Internet. Mehrere Dienste sammeln diese und lassen
      Sie prüfen, ob Ihre E-Mail-Adresse betroffen ist: [Have I Been Pwned](https://haveibeenpwned.com),
      [Mozilla Monitor](https://monitor.mozilla.org), der vom BSI empfohlene
      [Leak-Checker der Uni Bonn](https://leakchecker.uni-bonn.de) und der
      [HPI Identity Leak Checker](https://sec.hpi.de/ilc) (beide schicken das Ergebnis per Mail). Bei manchen
      können Sie sich für Benachrichtigungen eintragen. So erfahren Sie früh von einem Leck und können die
      betroffenen Passwörter ändern.

  - id: shield-your-password/pin
    point: Passwort/PIN bei der Eingabe abschirmen
    priority: Optional
    details: >-
      Achten Sie beim Eintippen in der Öffentlichkeit darauf, dass keine Kamera und niemand über Ihre Schulter
      zusieht. Verdecken Sie Passwort oder PIN bei der Eingabe und zeigen Sie Passwörter nie im Klartext an.

  - id: update-critical-passwords-periodically
    point: Kritische Passwörter gelegentlich erneuern
    priority: Optional
    details: >-
      Datenlecks sind häufig, und wahrscheinlich liegen einige Ihrer Passwörter bereits irgendwo im Netz.
      Gelegentliches Ändern der Passwörter besonders wichtiger Konten hilft. Sind alle Passwörter lang, stark
      und einzigartig, reicht etwa einmal im Jahr. Erzwungene regelmäßige Passwortwechsel in Organisationen
      werden [nicht mehr empfohlen](https://web.archive.org/web/20200303190807/https://duo.com/decipher/microsoft-will-no-longer-recommend-forcing-periodic-password-changes),
      weil sie zu schwächeren Passwörtern verleiten.

  - id: don’t-save-your-password-in-browsers
    point: Passwörter nicht im Browser speichern
    priority: Optional
    details: >-
      Die meisten Browser bieten an, Ihre Zugangsdaten zu speichern. Lehnen Sie das ab – sie sind nicht immer
      verschlüsselt und könnten Dritten Zugriff verschaffen. Nutzen Sie stattdessen einen eigenen
      Passwortmanager zum Speichern und automatischen Ausfüllen.

  - id: avoid-logging-in-on-someone-else’s-device
    point: Nicht auf fremden Geräten anmelden
    priority: Optional
    details: >-
      Melden Sie sich möglichst nicht auf fremden Computern an – Sie wissen nicht, ob das System sauber ist.
      Besonders vorsichtig sollten Sie bei öffentlichen Rechnern sein, auf denen Schadsoftware und Tracking
      häufiger vorkommen, und besonders bei kritischen Konten wie dem Online-Banking. Wenn es nicht anders
      geht, nutzen Sie ein privates/Inkognito-Fenster (Strg+Umschalt+N bzw. Cmd+Umschalt+N), damit Zugangsdaten,
      Cookies und Verlauf nicht gespeichert werden.

  - id: avoid-password-hints
    point: Keine Passwort-Hinweise verwenden
    priority: Optional
    details: >-
      Manche Seiten erlauben Passwort-Hinweise, deren Antworten oft leicht zu erraten sind. Sind Hinweise
      Pflicht, nutzen Sie zufällige Antworten und speichern Sie diese im Passwortmanager
      (`Name der ersten Schule: 6D-02-8B-!a-E8-8F-81`).

  - id: never-answer-online-security-questions-truthfully
    point: Sicherheitsfragen nie wahrheitsgemäß beantworten
    priority: Optional
    details: >-
      Fragt eine Seite nach Geburtsort, Mädchenname der Mutter oder dem ersten Auto, geben Sie keine echten
      Antworten. Diese Informationen lassen sich leicht online oder per Social Engineering herausfinden.
      Erfinden Sie eine Antwort und speichern Sie sie im Passwortmanager. Echte Wörter sind dabei besser als
      zufällige Zeichen, wie [hier erklärt](https://news.ycombinator.com/item?id=29244870).

  - id: don’t-use-a-4-digit-pin
    point: Keine 4-stellige PIN verwenden
    priority: Optional
    details: >-
      Schützen Sie Smartphone oder Computer nicht mit einer kurzen PIN, sondern mit einem Passwort oder einer
      deutlich längeren PIN. Rein numerische Codes sind leicht zu knacken (eine 4-stellige PIN hat 10.000
      Kombinationen, ein 4-stelliger alphanumerischer Code rund 7,4 Millionen).

  - id: avoid-using-sms-for-2fa
    point: SMS als zweiten Faktor meiden
    priority: Optional
    details: >-
      Wählen Sie bei der Zwei-Faktor-Authentifizierung möglichst App-Codes (TOTP) oder einen
      Hardware-Schlüssel. SMS sind anfällig für [SIM-Swapping](https://www.maketecheasier.com/sim-card-hijacking)
      und [Abfangen](https://secure-voice.com/ss7_attacks). Außerdem ist unklar, wie sicher Ihre Telefonnummer
      gespeichert und wofür sie sonst genutzt wird. Praktisch funktionieren SMS nur mit Empfang und kommen
      manchmal verzögert an. Verlangt ein Dienst zwingend eine Nummer zur Wiederherstellung, kann eine zweite
      Prepaid-Nummer nur für diesen Zweck sinnvoll sein. Trotzdem gilt: SMS-2FA ist immer noch viel besser als
      gar kein zweiter Faktor.

  - id: avoid-using-your-pm-to-generate-otps
    point: Einmalcodes nicht im Passwortmanager erzeugen
    priority: Advanced
    details: >-
      Viele Passwortmanager (z. B. KeePassXC) können auch 2FA-Codes erzeugen. Für maximale Sicherheit sollten
      Sie Ihren Haupt-Passwortmanager nicht gleichzeitig als Authenticator nutzen – sonst wird er zum einzigen
      Angriffspunkt. Besser ist eine eigene
      [Authenticator-App](https://github.com/Lissy93/awesome-privacy#2-factor-authentication) auf Handy oder Laptop.

  - id: avoid-face-unlock
    point: Gesichtserkennung zum Entsperren meiden
    priority: Advanced
    details: >-
      Viele Handys und Laptops lassen sich per Gesichtserkennung entsperren. Das ist bequem, lässt sich aber
      auf verschiedene Weise [austricksen](https://www.forbes.com/sites/jvchamary/2017/09/18/security-apple-face-id-iphone-x/),
      etwa mit Fotos oder Rekonstruktionen aus Kameraaufnahmen. Anders als Ihr Passwort ist Ihr Gesicht
      wahrscheinlich auf Fotos im Internet und in Aufnahmen von Überwachungskameras zu finden.

  - id: watch-out-for-keyloggers
    point: Auf Keylogger achten
    priority: Advanced
    details: >-
      Ein Hardware-[Keylogger](https://de.wikipedia.org/wiki/Keylogger) ist ein kleines Gerät zwischen Tastatur
      und USB-Anschluss, das alle Tastenanschläge mitschneidet und teils an einen Server sendet – inklusive
      Passwörtern. Prüfen Sie den USB-Anschluss, wenn Ihr PC unbeaufsichtigt war. Keylogger können auch im
      Tastaturgehäuse versteckt sein; achten Sie auf Manipulationsspuren und nutzen Sie ggf. Ihre eigene
      Tastatur. Eingaben über eine Bildschirmtastatur, aus der Zwischenablage oder per Autofill des
      Passwortmanagers kann ein Hardware-Keylogger nicht abfangen.

  - id: consider-a-hardware-token
    point: Hardware-Sicherheitsschlüssel erwägen
    priority: Advanced
    details: >-
      Ein U2F/FIDO2-Sicherheitsschlüssel ist ein USB- (oder NFC-)Gerät, das Sie bei der Anmeldung anstecken,
      statt einen Code aus der App einzugeben. Beispiele sind [YubiKey](https://www.yubico.com),
      [SoloKey](https://solokeys.com) und [Nitrokey](https://www.nitrokey.com) (aus Deutschland). Weil der
      Browser direkt mit dem Schlüssel spricht und die Adresse der Seite prüft, lässt er sich von einer
      Phishing-Seite nicht täuschen. [Dieser Beitrag](https://security.stackexchange.com/a/71704) erklärt die
      Sicherheit von FIDO-Tokens gut. Bewahren Sie den Schlüssel sicher auf oder tragen Sie ihn bei sich, und
      richten Sie wenn möglich einen zweiten Schlüssel als Reserve ein.

  - id: use-passkeys-where-available
    point: Passkeys nutzen, wo verfügbar
    priority: Optional
    details: >-
      Passkeys (auch FIDO2/WebAuthn) sind eine passwortlose Anmeldemethode, die sicherer und bequemer ist als
      klassische Passwörter. Sie melden sich per Fingerabdruck, Gesicht oder PIN Ihres Geräts an, und Passkeys
      sind resistent gegen Phishing. Viele große Dienste unterstützen sie inzwischen, darunter Google, Apple,
      Microsoft, GitHub und PayPal. Aktivieren Sie Passkeys, wo angeboten – als Ersatz für das Passwort oder
      als zusätzlichen Faktor.

  - id: consider-offline-password-manager
    point: Offline-Passwortmanager erwägen
    priority: Advanced
    details: >-
      Ein verschlüsselter Offline-Passwortmanager gibt Ihnen die volle Kontrolle über Ihre Daten.
      [KeePass](https://awesome-privacy.xyz/essentials/password-managers/keepass) ist beliebt, mit vielen
      [Plugins](https://keepass.info/plugins.html) und Ablegern. Bekannte Programme sind
      [KeePassXC](https://keepassxc.org) (PC/Mac/Linux), [KeePassDX](https://www.keepassdx.com) (Android) und
      [Strongbox](https://apps.apple.com/de/app/strongbox-password-safe/id897283731) (iOS). Der Nachteil: etwas
      weniger Komfort, und um Sicherungskopien der Datenbank müssen Sie sich selbst kümmern.

  - id: consider-unique-usernames
    point: Einzigartige Benutzernamen erwägen
    priority: Advanced
    details: >-
      Unterschiedliche Passwörter sind ein guter Anfang. Nutzen Sie zusätzlich je Konto einen eigenen
      Benutzernamen, eine eigene E-Mail-Adresse oder Telefonnummer, wird unbefugter Zugriff deutlich schwerer.
      Am einfachsten gelingt das mit automatisch erzeugten E-Mail-Aliasen: Mails an
      [beliebig]@ihre-domain.de landen in Ihrem Postfach (siehe
      [Alias-Anbieter](https://github.com/Lissy93/awesome-privacy#mail-forwarding)). Benutzernamen kann Ihr
      Passwortmanager erzeugen und speichern; virtuelle Rufnummern bieten VoIP-Anbieter an.

  - id: choose-your-second-factor
    point: Zweiten Faktor bewusst auswählen
    priority: Essential
    details: >-
      Nicht jeder zweite Faktor ist gleich sicher. Von schwach nach stark: Code per E-Mail, Code per SMS,
      Bestätigung per Tastendruck auf einem anderen Gerät (Push), Code aus einer App (TOTP, z. B. Aegis,
      2FAS oder KeePassXC), Sicherheitsschlüssel als Datei (.key) und am stärksten ein haptischer
      Sicherheitsschlüssel nach FIDO2 (z. B. YubiKey, Nitrokey). Laut Microsoft wehrt bereits ein zweiter
      Faktor über 99,9 % der Angriffe auf Konten ab – nehmen Sie also lieber den schwächeren Faktor als gar
      keinen. Bestätigen Sie Push-Anfragen nie, wenn Sie sich nicht gerade selbst anmelden.
  softwareLinks:
    - title: Passwortmanager
      url: https://awesome-privacy.xyz/essentials/password-managers
    - title: Zwei-Faktor-Authentifizierung
      url: https://awesome-privacy.xyz/essentials/2-factor-authentication
    - title: BSI – Zwei-Faktor-Authentisierung
      url: https://www.bsi.bund.de/DE/Themen/Verbraucherinnen-und-Verbraucher/Informationen-und-Empfehlungen/Cyber-Sicherheitsempfehlungen/Accountschutz/Zwei-Faktor-Authentisierung/zwei-faktor-authentisierung_node.html

- title: Surfen im Web
  slug: web-browsing
  description: Tracking, Zensur und Datensammlung im Netz vermeiden
  icon: browser
  intro: >-
    Die meisten Websites nutzen irgendeine Form von Tracking, um das Verhalten und die Vorlieben ihrer
    Besucher zu erfassen. Diese Daten können extrem detailliert sein und sind daher für Unternehmen,
    Behörden und Datendiebe sehr wertvoll. Datenlecks sind häufig, und Web-Aktivitäten einer Person
    zuzuordnen ist oft trivial.


    Es gibt zwei Hauptarten des Trackings: zustandsbehaftet (Cookies) und zustandslos (Fingerprinting).
    Cookies sind kleine Datenstücke mit einer eindeutigen ID, die im Browser gespeichert werden. Browser-
    Fingerprinting erkennt Sie dagegen sehr genau anhand Ihrer Gerätedaten: Browser, Betriebssystem,
    Bildschirmauflösung, Schriftarten, Plugins, Zeitzone, Sprache und sogar Hardware. Dazu kommt das
    laufende Messen während Sie auf einer Seite sind: Mausbewegungen, Klicks, Scrolltiefe, Verweildauer
    und sogar nicht abgeschickte Formulareingaben.


    Dieser Bereich zeigt, wie Sie sich besser schützen, Tracking reduzieren und Ihre Privatsphäre verbessern.
  checklist:
  - id: block-ads
    point: Werbung blockieren
    priority: Essential
    details: >-
      Ein Werbeblocker verbessert Ihre Privatsphäre, weil er die Tracker in Werbeanzeigen blockiert.
      [uBlock Origin](https://awesome-privacy.xyz/networking/ad-blockers/ublock-origin) ist eine sehr
      effiziente, quelloffene Browser-Erweiterung von Raymond Hill (für Chrome gibt es „uBlock Origin Lite“).
      Werbung von Drittanbietern kann Sie verfolgen und Daten über Ihre Gewohnheiten sammeln, die verkauft
      oder für gezieltere Werbung genutzt werden – manche Anzeigen sind schlicht bösartig oder gefälscht.
      Ohne Werbung laden Seiten außerdem schneller und verbrauchen weniger Daten.

  - id: ensure-website-is-legitimate
    point: Echtheit der Website prüfen
    priority: Essential
    details: >-
      Prüfen Sie beim Anmelden immer die Adresse. Entscheidend ist der Teil unmittelbar vor dem ersten
      Schrägstrich: `sparkasse.de.sicherheit-kunden.com/login` gehört zu sicherheit-kunden.com, nicht zur
      Sparkasse. Lesezeichen für häufig besuchte Seiten helfen. Achten Sie bei neuen Seiten auf Warnzeichen
      wie Browser-Warnungen, Weiterleitungen, Spam und Pop-ups. Im Zweifel prüfen Sie die Seite mit
      [VirusTotal](https://www.virustotal.com), [urlscan.io](https://urlscan.io),
      [Google Safe Browsing](https://transparencyreport.google.com/safe-browsing/search) oder bei Online-Shops
      mit dem [Fakeshop-Finder der Verbraucherzentrale](https://www.verbraucherzentrale.de/fakeshopfinder-71560).

  - id: watch-out-for-browser-malware
    point: Auf Browser-Schadsoftware achten
    priority: Essential
    details: >-
      System oder Browser können durch Spyware, Krypto-Miner, Browser-Hijacker, bösartige Weiterleitungen
      oder Adware kompromittiert werden. Meist schützen Sie sich schon, indem Sie Pop-ups ignorieren, nicht
      wahllos klicken und Seiten verlassen, vor denen der Browser warnt. Typische Anzeichen: geänderte
      Startseite oder Suchmaschine, unbekannte Symbolleisten oder Erweiterungen, deutlich mehr Werbung,
      Fehler und langsames Laden. Heimdal erklärt [Anzeichen](https://heimdalsecurity.com/blog/warning-signs-operating-system-infected-malware),
      [Infektionswege](https://heimdalsecurity.com/blog/practical-online-protection-where-malware-hides)
      und [Entfernung](https://heimdalsecurity.com/blog/malware-removal) (englisch).

  - id: use-a-privacy-respecting-browser
    point: Datenschutzfreundlichen Browser nutzen
    priority: Essential
    details: >-
      [Firefox](https://awesome-privacy.xyz/essentials/browsers/firefox) (mit ein paar Anpassungen) und
      [Brave](https://awesome-privacy.xyz/essentials/browsers/brave-browser) sind sichere, datenschutz-
      freundliche Browser – schnell, quelloffen, einfach zu bedienen und für alle großen Systeme verfügbar.
      Ihr Browser sieht alles, was Sie online tun. Meiden Sie daher nach Möglichkeit Google Chrome, Edge und
      Safari, die (ohne passende Einstellungen) Nutzungsdaten sammeln und umfangreiches Tracking erlauben.
      Firefox lässt sich z. B. mit den user.js-Konfigurationen von [arkenfox](https://github.com/arkenfox/user.js/wiki)
      härten. Für maximale Anonymität gibt es den Tor-Browser. Mehr:
      [Datenschutz-Browser](https://github.com/Lissy93/awesome-privacy#browsers).

  - id: use-a-private-search-engine
    point: Datenschutzfreundliche Suchmaschine nutzen
    priority: Essential
    details: >-
      Eine Suchmaschine ohne Tracking verringert das Risiko, dass Ihre Suchbegriffe gespeichert oder gegen
      Sie verwendet werden. Gute Alternativen sind
      [DuckDuckGo](https://awesome-privacy.xyz/essentials/search-engines/duckduckgo),
      [Startpage](https://www.startpage.com), [Brave Search](https://search.brave.com),
      [Ecosia](https://www.ecosia.org) oder [Qwant](https://www.qwant.com). Google setzt auf
      [sehr umfangreiches](https://hackernoon.com/data-privacy-concerns-with-google-b946f2b7afea) Tracking,
      ebenso Bing, Yahoo und Yandex. Stellen Sie die
      [Standardsuche Ihres Browsers](https://duckduckgo.com/install) um.

  - id: remove-unnecessary-browser-addons
    point: Unnötige Browser-Erweiterungen entfernen
    priority: Essential
    details: >-
      Erweiterungen können alles sehen, aufzeichnen oder verändern, was Sie im Browser tun, und manche
      harmlos wirkenden Add-ons verfolgen bösartige Absichten. Websites können außerdem erkennen, welche
      Erweiterungen installiert sind, und damit Ihren Fingerabdruck schärfen. In den Stores von Firefox und
      Chrome sehen Sie vor der Installation, welche Berechtigungen eine Erweiterung verlangt. Lesen Sie
      Bewertungen, installieren Sie nur, was Sie wirklich brauchen, und entfernen Sie Ungenutztes.

  - id: keep-browser-up-to-date
    point: Browser aktuell halten
    priority: Essential
    details: >-
      Ständig werden [Sicherheitslücken in Browsern](https://cve.mitre.org/cgi-bin/cvekey.cgi?keyword=browser)
      gefunden und geschlossen. Halten Sie Ihren Browser deshalb aktuell. Ihre Version sehen Sie
      [hier](https://www.whatismybrowser.com/); eine Anleitung zum Aktualisieren gibt es
      [hier](https://www.whatismybrowser.com/guides/how-to-update-your-browser/). Viele Browser aktualisieren
      sich automatisch.

  - id: check-for-https
    point: Auf HTTPS achten
    priority: Essential
    details: >-
      Auf Seiten ohne HTTPS werden Ihre Eingaben unverschlüsselt übertragen und können mitgelesen werden.
      Geben Sie dort keine Daten ein. Aber Vorsicht: Das Schloss-Symbol bedeutet nur eine verschlüsselte
      Verbindung – nicht, dass die Seite echt oder vertrauenswürdig ist. Auch Phishing-Seiten haben heute
      fast immer HTTPS. Moderne Browser haben einen „Nur-HTTPS-Modus“ eingebaut; aktivieren Sie ihn in den
      Einstellungen.

  - id: use-dns-over-https
    point: DNS-over-HTTPS nutzen
    priority: Essential
    details: >-
      Klassische DNS-Anfragen (welche Adresse gehört zu welchem Namen?) laufen im Klartext und können
      mitgelesen oder manipuliert werden. DNS-over-HTTPS (oder DNS-over-TLS) verschlüsselt sie. Beliebte
      Anbieter sind [Quad9](https://quad9.net) (Sitz in der Schweiz),
      [Cloudflare](https://awesome-privacy.xyz/networking/dns-providers/cloudflare) 1.1.1.1,
      [AdGuard DNS](https://awesome-privacy.xyz/networking/dns-providers/adguard) und
      [dns4all/Digitalcourage](https://digitalcourage.de/support/zensurfreier-dns-server) – oder
      [vergleichen Sie Anbieter](https://awesome-privacy.xyz/networking/dns-providers). Im Browser ist es mit
      wenigen Klicks aktiviert. Nachteil: Netzwerk-Filter (z. B. Kinderschutz im Router) greifen dann evtl. nicht.

  - id: compartmentalise-your-browsing
    point: Surfen in Bereiche aufteilen
    priority: Essential
    details: >-
      Trennen Sie verschiedene Lebensbereiche beim Surfen – etwa eigene Profile für Arbeit, allgemeines
      Surfen, soziale Medien und Online-Shopping. So können Datenhändler weniger Verbindungen herstellen.
      [Firefox-Container](https://awesome-privacy.xyz/security-tools/browser-extensions/firefox-multi-account-containers)
      sind genau dafür gemacht. Alternativ nutzen Sie verschiedene Browser für verschiedene Aufgaben
      ([Brave](https://awesome-privacy.xyz/essentials/browsers/brave-browser),
      [Firefox](https://awesome-privacy.xyz/essentials/browsers/firefox),
      [Tor](https://awesome-privacy.xyz/networking/anonymity-networks/tor) usw.).

  - id: use-incognito
    point: Inkognito-Modus nutzen
    priority: Essential
    details: >-
      Auf fremden Geräten sollten Sie ein privates/Inkognito-Fenster verwenden. Dann werden Verlauf, Cookies
      und manche Daten nicht gespeichert – unsichtbar sind Sie dadurch aber nicht, Tracking ist weiterhin möglich.

  - id: understand-your-browser-fingerprint
    point: Browser-Fingerabdruck verstehen
    priority: Essential
    details: >-
      Browser-Fingerprinting ist eine sehr genaue Tracking-Methode, bei der eine Website Sie anhand Ihrer
      Gerätedaten wiedererkennt. Ihren Fingerabdruck sehen Sie auf
      [amiunique.org](https://amiunique.org/fingerprint) oder
      [coveryourtracks.eff.org](https://coveryourtracks.eff.org). Ziel ist, möglichst wenig einzigartig zu
      sein: Auffällig sind z. B. ungewöhnliche Versionsnummern im User-Agent, eine sehr spezifische Liste an
      Dateiformaten (Accept) oder viele bevorzugte Sprachen. Abhilfe: Brave verwenden, Browser nicht
      exotisch konfigurieren und die Sprachliste auf eine Sprache reduzieren.

  - id: manage-cookies
    point: Cookies verwalten
    priority: Essential
    details: >-
      Regelmäßiges Löschen von Cookies reduziert Tracking durch Websites. Cookies können außerdem Ihr
      Sitzungs-Token enthalten – wer es abgreift, kommt ohne Passwort in Ihr Konto. Löschen Sie Cookies
      daher regelmäßig, oder lassen Sie den Browser sie beim Schließen automatisch löschen.

  - id: block-third-party-cookies
    point: Drittanbieter-Cookies blockieren
    priority: Essential
    details: >-
      Drittanbieter-Cookies stammen nicht von der Seite, die Sie besuchen, sondern von einem fremden Dienst,
      der so Daten über Ihre Sitzung sammeln kann. Firefox, Safari und Brave blockieren sie standardmäßig;
      in Chrome oder Edge schalten Sie sie in den Datenschutzeinstellungen ab.

  - id: block-third-party-trackers
    point: Drittanbieter-Tracker blockieren
    priority: Essential
    details: >-
      Tracker-Blocker verhindern, dass Websites, Werbenetzwerke und Analysedienste Sie im Hintergrund
      verfolgen. [Privacy Badger](https://awesome-privacy.xyz/security-tools/browser-extensions/privacy-badger),
      [DuckDuckGo Privacy Essentials](https://awesome-privacy.xyz/security-tools/browser-extensions/privacy-essentials),
      [uBlock Origin](https://awesome-privacy.xyz/networking/ad-blockers/ublock-origin), AdGuard und Ghostery
      sind wirksame Blocker für alle großen Browser.

  - id: beware-of-redirects
    point: Vorsicht bei Weiterleitungen
    priority: Optional
    details: >-
      Viele Weiterleitungen sind harmlos, andere werden im Phishing genutzt, um einen bösartigen Link seriös
      wirken zu lassen. Auch Kurzlinks (z. B. bit.ly) verbergen das eigentliche Ziel. Im Zweifel zeigt Ihnen
      [urlscan.io](https://urlscan.io) die echte Zieladresse und alle Weiterleitungen, ohne dass Sie die
      Seite selbst öffnen müssen.

  - id: do-not-sign-into-your-browser
    point: Nicht im Browser anmelden
    priority: Optional
    details: >-
      Viele Browser bieten eine Anmeldung an, um Verlauf, Lesezeichen und andere Daten zwischen Geräten zu
      synchronisieren. Das ermöglicht aber zusätzliche Datensammlung und vergrößert die Angriffsfläche.

  - id: disallow-prediction-services
    point: Vorhersagedienste abschalten
    priority: Optional
    details: >-
      Manche Browser zeigen schon beim Tippen Suchvorschläge oder vervollständigen Adressen. Dann wird jeder
      Tastendruck an Google (bzw. Ihre Standardsuchmaschine) gesendet – nicht erst beim Drücken der Enter-Taste.

  - id: avoid-g-translate-for-webpages
    point: Google Übersetzer für Webseiten meiden
    priority: Optional
    details: >-
      Bei fremdsprachigen Seiten wird oft die Google-Übersetzung angeboten. Google erhält dabei alle Inhalte
      (inklusive Eingabefeldern) und Daten über Sie. Nutzen Sie lieber einen Übersetzungsdienst, der nicht im
      Browser verankert ist, oder eine lokale Übersetzung (z. B. die in Firefox integrierte).

  - id: disable-web-notifications
    point: Web-Benachrichtigungen deaktivieren
    priority: Optional
    details: >-
      Browser-Push-Benachrichtigungen sind ein beliebter Weg für Kriminelle, Sie zum Klicken zu bringen, weil
      sich der Absender leicht fälschen lässt. Schalten Sie sie in den Browser-Einstellungen ab oder erlauben
      Sie sie nur vertrauenswürdigen Seiten.

  - id: disable-automatic-downloads
    point: Automatische Downloads deaktivieren
    priority: Optional
    details: >-
      „Drive-by-Downloads“ sind ein gängiger Weg, Schaddateien auf Geräte zu bringen. Deaktivieren Sie
      automatische Downloads und seien Sie misstrauisch bei Seiten, die unerwartet einen Download anbieten.

  - id: disallow-access-to-sensors
    point: Zugriff auf Sensoren verweigern
    priority: Optional
    details: >-
      Mobile Websites können teils ohne Nachfrage auf Gerätesensoren zugreifen. Haben Sie dem Browser diese
      Rechte einmal erteilt, können alle Websites sie nutzen – ohne Erlaubnis oder Hinweis.

  - id: disallow-location
    point: Standortzugriff verweigern
    priority: Optional
    details: >-
      Über Ortungsdienste können Seiten Ihren Standort abfragen. Deaktivieren Sie das in den Einstellungen.
      Ihr ungefährer Standort lässt sich trotzdem noch über andere Wege (z. B. die IP-Adresse) ermitteln.

  - id: disallow-camera/-microphone-access
    point: Kamera-/Mikrofonzugriff verweigern
    priority: Optional
    details: >-
      Prüfen Sie in den Browser-Einstellungen, dass keine Website Zugriff auf Kamera oder Mikrofon hat.
      Zusätzlich kann eine physische Webcam-Abdeckung sinnvoll sein.

  - id: disable-browser-password-saves
    point: Passwortspeicher des Browsers deaktivieren
    priority: Optional
    details: >-
      Lassen Sie den Browser keine Benutzernamen und Passwörter speichern – diese sind oft leicht einsehbar.
      Nutzen Sie stattdessen einen Passwortmanager.

  - id: disable-browser-autofill
    point: Autofill im Browser deaktivieren
    priority: Optional
    details: >-
      Schalten Sie das automatische Ausfüllen vertraulicher oder persönlicher Daten ab. Ist der Browser
      kompromittiert, kann diese Funktion schaden. Nutzen Sie stattdessen die Notizfunktion Ihres
      Passwortmanagers.

  - id: protect-from-exfil-attack
    point: Vor CSS-Exfiltration schützen
    priority: Optional
    details: >-
      Beim „CSS Exfiltrate“-Angriff werden Zugangsdaten und andere sensible Daten allein mit CSS abgegriffen.
      Schutz bietet das Plugin [CSS Exfil Protection](https://github.com/mlgualtieri/CSS-Exfil-Protection).

  - id: deactivate-activex
    point: ActiveX deaktivieren
    priority: Optional
    details: >-
      ActiveX ist eine Erweiterungsschnittstelle im alten Internet Explorer. Sie wird kaum noch genutzt, gibt
      Plugins aber weitreichende Rechte und ist gefährlich – deaktivieren Sie sie (bzw. nutzen Sie den
      Internet Explorer gar nicht mehr).

  - id: disable-webrtc
    point: WebRTC deaktivieren
    priority: Optional
    details: >-
      WebRTC ermöglicht Audio-/Videoanrufe und Dateiaustausch direkt im Browser, kann aber Ihre echte
      IP-Adresse verraten, selbst bei Nutzung eines Proxys oder mancher VPNs.
      [Hier prüfen Sie, ob Sie betroffen sind](https://browserleaks.com/webrtc).

  - id: spoof-html5-canvas-sig
    point: HTML5-Canvas-Signatur verschleiern
    priority: Optional
    details: >-
      Canvas-Fingerprinting erlaubt es Websites, Nutzer sehr genau wiederzuerkennen. Abhilfe schaffen
      Erweiterungen wie Canvas-Fingerprint-Blocker, Brave (randomisiert den Fingerabdruck) oder der
      [Tor-Browser](https://awesome-privacy.xyz/networking/anonymity-networks/tor).

  - id: spoof-user-agent
    point: User-Agent verschleiern
    priority: Optional
    details: >-
      Der User-Agent verrät der Website Gerät, Browser und Version. Ein gängiger User-Agent macht Sie weniger
      einzigartig; wechseln Sie ihn nur gezielt, denn ein exotischer User-Agent fällt erst recht auf.

  - id: disregard-dnt
    point: „Do Not Track“ nicht überbewerten
    priority: Optional
    details: >-
      „Do Not Track“ bringt wenig, weil viele Websites es ignorieren. Da es selten genutzt wird, kann es Ihren
      Fingerabdruck sogar einzigartiger machen.

  - id: prevent-hsts-tracking
    point: HSTS-Tracking verhindern
    priority: Optional
    details: >-
      HSTS soll Websites sicherer machen, wurde aber auch missbraucht, um „Super-Cookies“ zu setzen. In
      Chromium-basierten Browsern lässt sich das unter chrome://net-internals/#hsts bereinigen.

  - id: prevent-automatic-browser-connections
    point: Automatische Browser-Verbindungen unterbinden
    priority: Optional
    details: >-
      Auch wenn Sie nicht surfen, sendet der Browser ggf. Nutzungsstatistiken, Analysen und Diagnosedaten
      nach Hause. Vieles davon lässt sich in den Einstellungen abschalten.

  - id: enable-1st-party-isolation
    point: First-Party-Isolation aktivieren
    priority: Optional
    details: >-
      Bei [First Party Isolation](https://addons.mozilla.org/de/firefox/addon/first-party-isolation/) werden
      alle Kennungen und Browserdaten an die Domain in der Adressleiste gebunden – das reduziert seiten-
      übergreifendes Tracking erheblich. Firefox hat das mit „Vollständiger Cookie-Schutz“ inzwischen eingebaut.

  - id: strip-tracking-params-from-urls
    point: Tracking-Parameter aus Links entfernen
    priority: Advanced
    details: >-
      Links enthalten oft angehängte Parameter (z. B. `?utm_source=…`, `?fbclid=…`), um Herkunft und
      Weiterleitung zu erfassen. Entfernen Sie diese manuell oder automatisch mit einer Erweiterung wie
      [ClearURLs](https://awesome-privacy.xyz/security-tools/browser-extensions/clearurls).

  - id: first-launch-security
    point: Sicherheit beim ersten Start
    priority: Advanced
    details: >-
      Beim ersten Start nach der Installation – noch bevor Sie Datenschutzeinstellungen vornehmen konnten –
      melden sich die meisten Browser beim Hersteller. Trennen Sie daher nach der Installation erst die
      Internetverbindung, konfigurieren Sie den Browser und gehen Sie danach wieder online.

  - id: use-the-tor-browser
    point: Tor-Browser verwenden
    priority: Advanced
    details: >-
      Das [Tor](https://awesome-privacy.xyz/networking/anonymity-networks/tor)-Projekt bietet einen Browser,
      der Ihren Datenverkehr verschlüsselt über mehrere Knoten leitet und so vor Abfangen und Tracking
      schützt. Nachteile sind Geschwindigkeit und Komfort.

  - id: disable-javascript
    point: JavaScript deaktivieren
    priority: Advanced
    details: >-
      Viele moderne Websites basieren auf JavaScript, ohne das sie kaum nutzbar sind. Wer konsequent sein
      will, verringert damit aber die Angriffsfläche erheblich (z. B. mit NoScript oder dem
      „Sicherster“-Modus im Tor-Browser).

  - id: clear-browsing-data-regularly
    point: Browserdaten regelmäßig löschen
    priority: Essential
    details: >-
      Gegen Tracking im Browser helfen drei Stellschrauben: Einstellungen (Suchmaschine ändern,
      Aktivitätsverfolgung und Cookies einschränken), das regelmäßige Löschen temporärer Daten (Cookies,
      Cache, Website-Daten – oder automatisch beim Schließen) und Erweiterungen wie uBlock Origin, AdGuard,
      Ghostery oder Privacy Badger. Kontrollieren Sie diese Einstellungen regelmäßig, denn Updates setzen
      manches zurück.
  softwareLinks:
    - title: Datenschutz-Browser
      url: https://github.com/Lissy93/awesome-privacy#browsers
    - title: Suchmaschinen
      url: https://github.com/Lissy93/awesome-privacy#search-engines
    - title: Browser-Erweiterungen
      url: https://github.com/Lissy93/awesome-privacy#browser-extensions
    - title: Browser- & Lesezeichen-Sync
      url: https://github.com/Lissy93/awesome-privacy#browser-sync
  color: emerald

- title: E-Mail
  slug: email
  description: Das Tor zu Ihren Online-Konten schützen
  icon: email
  intro: >-
    Rund 50 Jahre nach der ersten E-Mail ist sie noch immer fester Bestandteil unseres Alltags. Umso
    erstaunlicher, wie grundlegend unsicher diese Infrastruktur ist. Betrug per E-Mail
    [nimmt zu](https://www.csoonline.com/article/3247670/email/email-security-in-2018.html), und ohne
    grundlegende Maßnahmen sind Sie gefährdet.


    Wer Zugriff auf Ihr Postfach erhält, kann über „Passwort vergessen“ auch Ihre anderen Konten übernehmen.
    Die Sicherheit Ihres E-Mail-Kontos ist daher zentral für Ihre digitale Sicherheit. Gleichzeitig ist
    E-Mail der häufigste Weg für Phishing.


    Die großen Anbieter „kostenloser“ E-Mail-Dienste sind nicht für Datenschutz bekannt: Gmail
    [erstellte Listen Ihrer Einkäufe](https://www.cnbc.com/2019/05/17/google-gmail-tracks-purchase-history-how-to-delete-it.html)
    aus Rechnungen im Posteingang. Yahoo durchsuchte E-Mails in Echtzeit
    [für US-Geheimdienste](https://www.reuters.com/article/us-yahoo-nsa-exclusive-idUSKCN1241YT), und
    Werbetreibende [erhielten Zugriff](https://thenextweb.com/insider/2018/08/29/both-yahoo-and-aol-are-scanning-customer-emails-to-attract-advertisers)
    auf Nachrichten von Yahoo- und AOL-Nutzern.
  checklist:
  - id: have-more-than-one-email-address
    point: Mehr als eine E-Mail-Adresse nutzen
    priority: Essential
    details: >-
      Nutzen Sie für sicherheitskritische Kommunikation (Bank, Behörden, Passwort-Wiederherstellung) eine
      andere Adresse als für Newsletter und Online-Shops. Diese Trennung begrenzt den Schaden bei einem
      Datenleck und erleichtert die Wiederherstellung eines gekaperten Kontos.

  - id: keep-email-address-private
    point: E-Mail-Adresse privat halten
    priority: Essential
    details: >-
      Veröffentlichen Sie Ihre Haupt-Adresse nicht – E-Mail-Adressen sind der Ausgangspunkt für die meisten
      Phishing-Angriffe.

  - id: keep-your-account-secure
    point: E-Mail-Konto absichern
    priority: Essential
    details: >-
      Nutzen Sie ein langes, einzigartiges Passwort, aktivieren Sie 2FA und seien Sie beim Anmelden
      aufmerksam. Ihr E-Mail-Konto ist für Angreifer der einfachste Weg zu all Ihren anderen Konten.

  - id: disable-automatic-loading-of-remote-content
    point: Externe Inhalte nicht automatisch laden
    priority: Essential
    details: >-
      E-Mails können externe Inhalte wie Bilder enthalten, die automatisch vom Server geladen werden. Das
      verrät Ihre IP-Adresse, Ihr Gerät und dass Sie die Mail geöffnet haben (Zählpixel). Deaktivieren Sie das
      Nachladen in Ihrem Mailprogramm. Mehr dazu in [diesem Artikel](https://www.theverge.com/2019/7/3/20680903/email-pixel-trackers-how-to-stop-images-automatic-download) (englisch).

  - id: use-plaintext
    point: Nur-Text-Mails verwenden
    priority: Optional
    details: >-
      Es gibt zwei Arten von E-Mails: Nur-Text und HTML. Nur-Text ist für Datenschutz und Sicherheit klar
      vorzuziehen, da HTML-Mails oft Kennungen in Links und Bildern enthalten. Zudem gibt es Angriffe auf den
      HTML-Parser des Mailprogramms, die bei Nur-Text nicht funktionieren. Anleitungen für viele Mailprogramme
      gibt es auf [UsePlaintext.email](https://useplaintext.email/).

  - id: don’t-connect-third-party-apps-to-your-email-account
    point: Keine Dritt-Apps mit dem Postfach verbinden
    priority: Optional
    details: >-
      Geben Sie einer fremden App oder einem Plugin vollen Zugriff auf Ihr Postfach, kann diese alle Ihre
      E-Mails und deren Inhalte lesen – ein erhebliches Sicherheits- und Datenschutzrisiko.

  - id: don't-share-sensitive-data-via-email
    point: Keine sensiblen Daten per E-Mail senden
    priority: Optional
    details: >-
      E-Mails lassen sich leicht abfangen, und Sie wissen nicht, wie sicher das Postfach des Empfängers ist.
      Für vertrauliche Informationen ist unverschlüsselte E-Mail daher nicht geeignet.

  - id: consider-switching-to-a-secure-mail-provider
    point: Wechsel zu sicherem Mail-Anbieter erwägen
    priority: Optional
    details: >-
      Seriöse, sichere Anbieter wie [Proton Mail](https://awesome-privacy.xyz/communication/encrypted-email/protonmail),
      [Tuta](https://awesome-privacy.xyz/communication/encrypted-email/tuta) (aus Hannover),
      [Posteo](https://posteo.de) oder [mailbox.org](https://mailbox.org) (beide aus Berlin) bieten
      Verschlüsselung, Datenschutz und Sicherheitsfunktionen – oft als Freemium- oder günstiges Bezahlmodell,
      finanziert ohne Werbung.

  - id: use-smart-key
    point: Smartcard/Sicherheitsschlüssel für PGP nutzen
    priority: Advanced
    details: >-
      OpenPGP bietet keine „Forward Secrecy“: Wird Ihr privater Schlüssel oder der des Empfängers gestohlen,
      sind alle damit verschlüsselten Nachrichten lesbar. Schützen Sie private Schlüssel daher sorgfältig,
      etwa mit einem USB-Sicherheitsschlüssel (z. B. Nitrokey, YubiKey), der Nachrichten signiert und
      entschlüsselt, ohne dass der Schlüssel das Gerät verlässt.

  - id: use-aliasing-/-anonymous-forwarding
    point: Aliase / anonyme Weiterleitung nutzen
    priority: Advanced
    details: >-
      Mit E-Mail-Aliasen landen Mails an [beliebig]@meine-domain.de trotzdem in Ihrem Postfach. So nutzen Sie
      für jeden Dienst eine eigene Adresse. Bekommen Sie Spam, sperren Sie den Alias und wissen sofort, welche
      Firma Ihre Adresse weitergegeben hat. Anbieter: [SimpleLogin](https://simplelogin.io),
      [addy.io](https://addy.io), Firefox Relay.

  - id: subaddressing
    point: Unteradressen (Plus-Adressen) nutzen
    priority: Optional
    details: >-
      Eine Alternative zu Aliasen sind Unteradressen: Alles nach dem `+` wird bei der Zustellung ignoriert
      (name+shop@anbieter.de). So sehen Sie, wer Ihre Adresse weitergegeben hat – Ihre echte Adresse bleibt
      aber erkennbar.

  - id: use-a-custom-domain
    point: Eigene Domain verwenden
    priority: Advanced
    details: >-
      Mit eigener Domain sind Sie nicht an die Adresse Ihres Mail-Anbieters gebunden und können jederzeit
      wechseln, ohne sich Sorgen um die Einstellung eines Dienstes machen zu müssen.

  - id: sync-with-a-client-for-backup
    point: Per Mailprogramm lokal sichern
    priority: Advanced
    details: >-
      Damit Sie bei einem Ausfall oder einer Kontosperre nicht den Zugriff auf Ihre E-Mails verlieren, kann
      Thunderbird Nachrichten mehrerer Konten per IMAP lokal auf Ihrem Gerät sichern.

  - id: be-careful-with-mail-signatures
    point: Vorsicht mit E-Mail-Signaturen
    priority: Advanced
    details: >-
      Sie wissen nicht, wie sicher das Postfach des Empfängers ist. Manche Erweiterungen lesen Nachrichten
      automatisch aus und legen aus Signaturen detaillierte Kontaktdatenbanken an.

  - id: be-careful-with-auto-replies
    point: Vorsicht mit Abwesenheitsnotizen
    priority: Advanced
    details: >-
      Abwesenheitsnotizen sind praktisch, verraten aber oft zu viel (Urlaubsort, Dauer, Vertretung) – Stoff
      für Social Engineering und gezielte Angriffe.

  - id: choose-the-right-mail-protocol
    point: Das richtige Mail-Protokoll wählen
    priority: Advanced
    details: >-
      Verwenden Sie keine veralteten Protokolle (älter als IMAPv4 oder POP3); diese haben bekannte
      Schwachstellen.

  - id: self-hosting
    point: Selbst-Hosting
    priority: Advanced
    details: >-
      Einen eigenen Mailserver zu betreiben, ist für Laien nicht empfehlenswert – ihn korrekt abzusichern ist
      entscheidend und erfordert gutes Netzwerkwissen.

  - id: always-use-tls-ports
    point: Immer TLS-Ports verwenden
    priority: Advanced
    details: >-
      Für POP3, IMAP und SMTP gibt es verschlüsselte Ports (SSL/TLS). Sie sind einfach zu nutzen, weit
      verbreitet und sollten immer statt der Klartext-Ports verwendet werden.

  - id: dns-availability
    point: DNS-Verfügbarkeit
    priority: Advanced
    details: >-
      Beim eigenen Mailserver: Nutzen Sie mindestens 2 MX-Einträge (zweiter und dritter als Reserve), damit
      DNS-Probleme die Erreichbarkeit nicht beeinträchtigen.

  - id: prevent-ddos-and-brute-force-attacks
    point: DDoS- und Brute-Force-Angriffe abwehren
    priority: Advanced
    details: >-
      Beim eigenen Mailserver (insbesondere SMTP): Begrenzen Sie gleichzeitige Verbindungen und die
      Verbindungsrate, um Bot-Angriffe abzuschwächen.

  - id: maintain-ip-blacklist
    point: IP-Sperrliste pflegen
    priority: Advanced
    details: >-
      Beim eigenen Mailserver verbessern eine aktuelle lokale IP-Sperrliste und Echtzeit-Sperrlisten für
      Spam-Links den Spamfilter und die Sicherheit.
  color: teal
  softwareLinks:
    - title: Sichere E-Mail-Anbieter
      url: https://github.com/Lissy93/awesome-privacy#encrypted-email
    - title: Mail-Weiterleitung
      url: https://github.com/Lissy93/awesome-privacy#anonymous-mail-forwarding
    - title: Vorkonfigurierte Mailserver
      url: https://github.com/Lissy93/awesome-privacy#pre-configured-mail-servers
    - title: E-Mail-Programme
      url: https://github.com/Lissy93/awesome-privacy#email-clients

- title: Messenger
  slug: messaging
  description: Ihre Kommunikation privat und sicher halten
  icon: messaging
  intro: >-
    Unsere Nachrichten gehören zu den persönlichsten Daten überhaupt – doch auf vielen großen Plattformen
    kann der Anbieter sie lesen und kann zur Herausgabe verpflichtet werden. Ende-zu-Ende-Verschlüsselung
    verhindert das, aber nur, wenn sie standardmäßig aktiv ist, der Quellcode überprüfbar ist und die App
    aktiv gepflegt wird. Auch Metadaten verdienen Aufmerksamkeit: Wer wann mit wem gesprochen hat, verrät
    fast so viel wie der Inhalt. Und Vorsicht: Phishing kommt längst nicht mehr nur per E-Mail, sondern auch
    über WhatsApp, Telegram und Co.
  checklist:
  - id: only-use-fully-end-to-end-encrypted-messengers
    point: Nur durchgehend Ende-zu-Ende-verschlüsselte Messenger nutzen
    priority: Essential
    details: >-
      Bei Ende-zu-Ende-Verschlüsselung werden Nachrichten auf Ihrem Gerät verschlüsselt und erst beim
      Empfänger entschlüsselt. Wer den Datenverkehr abfängt oder Zugriff auf die Server hat, kann die Inhalte
      nicht lesen.

  - id: use-only-open-source-messaging-platforms
    point: Nur quelloffene Messenger nutzen
    priority: Essential
    details: >-
      Ist der Quellcode offen, kann ihn jede fachkundige Person unabhängig prüfen – auf Hintertüren,
      Schwachstellen und andere Sicherheitsprobleme.

  - id: use-a-"trustworthy"-messaging-platform
    point: Einen „vertrauenswürdigen“ Messenger wählen
    priority: Essential
    details: >-
      Achten Sie darauf, dass der Messenger vollständig quelloffen, stabil und aktiv gepflegt ist und
      idealerweise von seriösen Entwicklern stammt (z. B. [Signal](https://signal.org)).

  - id: check-security-settings
    point: Sicherheitseinstellungen prüfen
    priority: Essential
    details: >-
      Aktivieren Sie Sicherheitsfunktionen wie Kontaktverifizierung, Sicherheitsbenachrichtigungen und
      Verschlüsselung. Deaktivieren Sie Optionales wie Lesebestätigungen, „zuletzt online“ und Tipp-Anzeige.

  - id: ensure-your-recipients-environment-is-secure
    point: Auch das Umfeld des Empfängers zählt
    priority: Essential
    details: >-
      Ihr Gespräch ist nur so sicher wie das schwächste Glied. Oft ist der einfachste Angriff der auf die am
      schlechtesten geschützte Person oder deren Gerät.

  - id: disable-cloud-services
    point: Cloud-Dienste deaktivieren
    priority: Essential
    details: >-
      Manche Messenger bieten eine Web- oder Desktop-Version an. Das vergrößert die Angriffsfläche und war
      schon Ursache mehrerer schwerer Sicherheitsprobleme – vermeiden Sie es nach Möglichkeit. Prüfen Sie
      auch, ob Chat-Backups unverschlüsselt in der Cloud landen.

  - id: secure-group-chats
    point: Gruppenchats absichern
    priority: Essential
    details: >-
      Je mehr Teilnehmer eine Gruppe hat, desto größer das Risiko. Prüfen Sie regelmäßig, ob alle Mitglieder
      noch die sind, die sie vorgeben zu sein.

  - id: create-a-safe-environment-for-communication
    point: Sichere Umgebung für Kommunikation schaffen
    priority: Essential
    details: >-
      Ihre Kommunikation kann an vielen Stellen überwacht oder abgefangen werden: auf Ihrem Gerät oder dem
      der anderen, beim Internetanbieter, an Netzknoten, beim Messenger-Anbieter oder auf dessen Servern.

  - id: agree-on-a-communication-plan
    point: Kommunikationsplan vereinbaren
    priority: Optional
    details: >-
      In manchen Situationen lohnt sich ein Kommunikationsplan mit Haupt- und Ausweichwegen, um sich sicher
      zu erreichen – und ein Familien-Codewort gegen Enkeltrick-Anrufe und „Hallo Mama“-Nachrichten.

  - id: strip-meta-data-from-media
    point: Metadaten aus Medien entfernen
    priority: Optional
    details: >-
      Metadaten sind „Daten über Daten“, z. B. Aufnahmeort und -zeit eines Fotos. Wenn Sie Fotos,
      Sprachnachrichten, Videos oder Dokumente senden, verraten Sie womöglich mehr als beabsichtigt.

  - id: defang-urls
    point: Links „entschärfen“
    priority: Optional
    details: >-
      Das Versenden von Links kann ungewollt Daten preisgeben, weil die Vorschau beim Empfänger erzeugt wird.
      Schreibt man verdächtige Links „entschärft“ (z. B. `beispiel[.]de`), werden sie weder als Vorschau
      geladen noch versehentlich angeklickt.

  - id: verify-your-recipient
    point: Empfänger verifizieren
    priority: Optional
    details: >-
      Stellen Sie sicher, dass Sie mit der richtigen Person sprechen und deren Konto nicht übernommen wurde –
      z. B. über die Sicherheitsnummer/Kontaktverifizierung in Signal. Bei ungewöhnlichen Bitten (Geld,
      Codes) kontaktieren Sie die Person über einen anderen, bekannten Weg.

  - id: enable-ephemeral-messages
    point: Selbstlöschende Nachrichten aktivieren
    priority: Optional
    details: >-
      Selbstlöschende Nachrichten verschwinden nach einer festgelegten Zeit. Geht Ihr Gerät verloren oder
      wird es gestohlen, sind nur die neuesten Nachrichten zugänglich.

  - id: avoid-sms
    point: SMS meiden
    priority: Optional
    details: >-
      SMS sind bequem, aber nicht sicher: Sie können abgefangen, gefälscht (Smishing) und per SIM-Swapping
      umgeleitet werden.

  - id: watch-out-for-trackers
    point: Auf Tracker achten
    priority: Optional
    details: >-
      Seien Sie vorsichtig bei Messengern mit Trackern – die gesammelten Nutzungsdaten sind oft sehr
      detailliert und können Ihre Identität und persönliche Informationen preisgeben. Prüfen können Sie das
      mit [Exodus Privacy](https://reports.exodus-privacy.eu.org/de/).

  - id: consider-jurisdiction
    point: Rechtsraum beachten
    priority: Advanced
    details: >-
      Berücksichtigen Sie, in welchem Land der Anbieter sitzt und wo die Daten gespeichert werden.

  - id: use-an-anonymous-platform
    point: Anonyme Plattform nutzen
    priority: Advanced
    details: >-
      Wenn Sie gezielt ins Visier geraten könnten, wählen Sie einen anonymen Messenger, der weder
      Telefonnummer noch andere persönliche Daten verlangt (z. B. Threema, Session, SimpleX).

  - id: ensure-forward-secrecy-is-supported
    point: Auf Forward Secrecy achten
    priority: Advanced
    details: >-
      Wählen Sie eine Plattform mit Forward Secrecy: Die App erzeugt für jede Nachricht einen neuen
      Schlüssel, sodass ein gestohlener Schlüssel alte Nachrichten nicht offenlegt.

  - id: consider-a-decentralized-platform
    point: Dezentrale Plattform erwägen
    priority: Advanced
    details: >-
      Läuft alles über einen zentralen Anbieter, müssen Sie ihm Ihre Daten und Metadaten anvertrauen und
      können nicht prüfen, ob das System frei von Hintertüren ist. Dezentrale Alternativen sind z. B. Matrix
      oder SimpleX.

  - id: harden-whatsapp-settings
    point: WhatsApp-Einstellungen härten
    priority: Optional
    details: >-
      Wenn WhatsApp wegen Gruppenzwang bleibt: Unter Einstellungen › Datenschutz › Erweitert
      „IP-Adresse in Anrufen schützen“ aktivieren (Anrufe laufen über WhatsApp-Server, das Gegenüber sieht
      Ihre IP nicht) und „Linkvorschau deaktivieren“ (schützt Ihre IP vor der Zielseite gesendeter Links).
      Das Google-Drive-/iCloud-Backup ausschalten oder Ende-zu-Ende-verschlüsseln, den automatischen
      Medien-Download blockieren und Berechtigungen einschränken. Meta sammelt trotzdem weiterhin Metadaten –
      für Vertrauliches sind Signal, Threema oder Matrix besser.
  softwareLinks:
    - title: Sichere Messenger
      url: https://github.com/Lissy93/awesome-privacy#encrypted-messaging
    - title: P2P-Messenger
      url: https://github.com/Lissy93/awesome-privacy#p2p-messaging
  color: cyan

- title: Soziale Medien
  slug: social-media
  description: Risiken in Online-Communities minimieren
  icon: social
  intro: >
    Online-Communities gibt es seit Beginn des Internets; sie ermöglichen Menschen weltweit, sich zu
    vernetzen und auszutauschen. So schön das ist – es gibt eine Schattenseite: erhebliche
    [Datenschutzprobleme](https://en.wikipedia.org/wiki/Privacy_concerns_with_social_networking_services).
    Soziale Netzwerke gehören privaten Unternehmen, die ihr Geld damit verdienen, Daten über Menschen zu
    sammeln und an Werbetreibende weiterzugeben. Gemessen wird dabei nicht nur, was Sie posten, sondern
    auch, wie lange Sie einen Beitrag lesen, worauf die Maus verweilt und was Sie ins Suchfeld tippen,
    ohne es abzuschicken. Daraus lassen sich erstaunlich private Schlüsse ziehen.


    Sichern Sie Ihr Konto und schränken Sie die Privatsphäre-Einstellungen ein – aber gehen Sie davon aus,
    dass alles, was absichtlich oder unabsichtlich hochgeladen wird, praktisch öffentlich ist.
  checklist:
  - id: secure-your-account
    point: Konto absichern
    priority: Essential
    details: >-
      Social-Media-Profile werden sehr häufig gestohlen oder übernommen. Schützen Sie Ihr Konto mit einem
      einzigartigen, starken Passwort und Zwei-Faktor-Authentifizierung.

  - id: check-privacy-settings
    point: Privatsphäre-Einstellungen prüfen
    priority: Essential
    details: >-
      In den meisten Netzwerken können Sie einstellen, wer was sieht. Prüfen Sie, welche Daten Sie wem zeigen,
      und ob Sie damit einverstanden sind – und schauen Sie regelmäßig nach, da Updates Einstellungen ändern.

  - id: think-of-all-interactions-as-public
    point: Alles als öffentlich betrachten
    priority: Essential
    details: >-
      Es gibt viele Wege, „private“ Inhalte trotzdem einzusehen. Fragen Sie sich vor jedem Post oder
      Kommentar: „Hätte ich ein Problem, wenn das komplett öffentlich wäre?“

  - id: think-of-all-interactions-as-permanent
    point: Alles als dauerhaft betrachten
    priority: Essential
    details: >-
      Nahezu jeder Beitrag, Kommentar und jedes Foto wird von zahllosen Drittdiensten gesichert, archiviert
      und durchsuchbar gemacht – praktisch für immer.

  - id: don't-reveal-too-much
    point: Nicht zu viel preisgeben
    priority: Essential
    details: >-
      Profilangaben sind eine Goldgrube für Betrüger, um Phishing persönlich zuzuschneiden. Teilen Sie nicht
      zu viele Details (Geburtsdatum, Heimatort, Schule, Haustiername …).

  - id: be-careful-what-you-upload
    point: Vorsicht, was Sie hochladen
    priority: Essential
    details: >-
      Statusmeldungen, Kommentare, Check-ins und Medien verraten oft mehr als beabsichtigt – besonders Fotos
      und Videos, auf denen im Hintergrund etwas zu sehen ist.

  - id: don't-share-email-or-phone-number
    point: E-Mail und Telefonnummer nicht teilen
    priority: Essential
    details: >-
      Ihre echte E-Mail-Adresse oder Handynummer liefert Betrügern, Trollen und Spammern Munition und
      ermöglicht es, verschiedene Profile miteinander zu verknüpfen.

  - id: don't-grant-unnecessary-permissions
    point: Keine unnötigen Berechtigungen erteilen
    priority: Essential
    details: >-
      Viele Social-Media-Apps fragen nach Zugriff auf Kontakte, Anrufliste, Standort, Nachrichten usw.
      Braucht die App das nicht, erlauben Sie es nicht.

  - id: be-careful-of-3rd-party-integrations
    point: Vorsicht bei Drittanbieter-Verknüpfungen
    priority: Essential
    details: >-
      Melden Sie sich bei anderen Diensten nicht per „Mit Facebook/Google anmelden“ an und entziehen Sie
      Apps, die Sie nicht mehr nutzen, den Zugriff.

  - id: avoid-publishing-geo-data-while-still-onsite
    point: Standort erst nach dem Verlassen teilen
    priority: Essential
    details: >-
      Wenn Sie Inhalte teilen, die einen Ort verraten, warten Sie, bis Sie dort weg sind – besonders im
      Urlaub, im Restaurant, Hotel, am Flughafen oder in öffentlichen Gebäuden. Und bedenken Sie: „Wir sind
      zwei Wochen weg“ ist auch eine Info für Einbrecher.

  - id: remove-metadata-before-uploading-media
    point: Metadaten vor dem Hochladen entfernen
    priority: Optional
    details: >-
      Die meisten Smartphones und viele Kameras hängen jedem Foto umfangreiche Zusatzdaten an (EXIF), z. B.
      GPS-Koordinaten. Entfernen Sie diese vor dem Hochladen.

  - id: implement-image-cloaking
    point: Bilder gegen Gesichtserkennung tarnen
    priority: Advanced
    details: >-
      Werkzeuge wie Fawkes verändern Gesichter auf Fotos minimal – für Menschen unsichtbar, aber
      Gesichtserkennungssysteme können das Gesicht dann nicht mehr zuordnen.

  - id: consider-false-information
    point: Falsche Angaben erwägen
    priority: Advanced
    details: >-
      Wenn Sie nur mitlesen und wenig posten möchten, nutzen Sie einen Fantasienamen und abweichende
      Kontaktdaten (Klarnamenpflicht der jeweiligen Plattform beachten).

  - id: don’t-have-any-social-media-accounts
    point: Gar keine Social-Media-Konten haben
    priority: Advanced
    details: >-
      Soziale Medien sind grundsätzlich nicht privat. Für maximale Sicherheit und Privatsphäre verzichten
      Sie auf die großen Netzwerke – oder weichen auf Alternativen wie Mastodon aus.

  - id: reset-ad-personalisation
    point: Werbe-Personalisierung abschalten
    priority: Optional
    details: >-
      Bezahlt wird für den besten Zeitpunkt einer Werbeanzeige – dafür werden Ihre Messwerte ausgewertet.
      In den Einstellungen der großen Plattformen (Meta „Werbepräferenzen“, Google „Meine Werbezentrale“,
      TikTok „Anzeigen“) können Sie personalisierte Werbung und die Nutzung von Aktivitäten außerhalb der
      Plattform einschränken. Viele Dienste bieten auch eine werbefreie Bezahlversion (Freemium) an.
  softwareLinks:
    - title: Alternative soziale Netzwerke
      url: https://github.com/Lissy93/awesome-privacy#social-networks
    - title: Alternative Videoplattformen
      url: https://github.com/Lissy93/awesome-privacy#video-platforms
    - title: Alternative Blog-Plattformen
      url: https://github.com/Lissy93/awesome-privacy#blogging-platforms
    - title: News-Reader
      url: https://github.com/Lissy93/awesome-privacy#news-readers-and-aggregation
  color: blue

- title: Netzwerke
  slug: networks
  description: Ihren Datenverkehr absichern
  icon: network
  intro: >
    Dieser Bereich zeigt, wie Sie Ihre Geräte sicher mit dem Internet verbinden – inklusive
    Router-Einstellungen und VPN. Denken Sie daran: Auch die IP-Adresse, die Ihr Router nach außen zeigt,
    wird bei jedem Seitenaufruf übertragen und verrät Ihren ungefähren Standort.
  checklist:
  - id: use-a-vpn
    point: VPN nutzen
    priority: Essential
    details: >-
      Nutzen Sie einen seriösen, kostenpflichtigen VPN-Dienst. Das verbirgt Ihre echte IP-Adresse vor den
      besuchten Seiten, reduziert die Daten, die Ihr Internetanbieter sammeln kann, und schützt in
      öffentlichen WLANs. Vorsicht bei Gratis-VPNs: Irgendwie müssen sie sich finanzieren – oft mit Ihren Daten.

  - id: change-your-router-password
    point: Router-Passwort ändern
    priority: Essential
    details: >-
      Ändern Sie nach dem Einrichten das Passwort der Router-Oberfläche. Standardpasswörter sind oft
      öffentlich bekannt. (Bei aktuellen FRITZ!Boxen ist das Kennwort individuell – aber trotzdem stark wählen.)

  - id: use-wpa2,-and-a-strong-password
    point: WPA2/WPA3 mit starkem Passwort nutzen
    priority: Essential
    details: >-
      Für das WLAN gibt es verschiedene Verschlüsselungsverfahren. Am sichersten sind derzeit WPA3 und
      WPA2 – mit einem langen WLAN-Passwort.

  - id: keep-router-firmware-up-to-date
    point: Router-Firmware aktuell halten
    priority: Essential
    details: >-
      Hersteller veröffentlichen Firmware-Updates, die Sicherheitslücken schließen und neue Standards
      einführen. Aktivieren Sie automatische Updates, wenn Ihr Router das anbietet.

  - id: implement-a-network-wide-vpn
    point: VPN für das ganze Netzwerk einrichten
    priority: Optional
    details: >-
      Wird das VPN auf Router, Firewall oder Heimserver eingerichtet, läuft der Verkehr aller Geräte
      verschlüsselt darüber – ohne einzelne VPN-Apps.

  - id: protect-against-dns-leaks
    point: DNS-Lecks verhindern
    priority: Optional
    details: >-
      Bei VPN-Nutzung sollten auch Ihre DNS-Anfragen durch das VPN laufen, nicht über Ihren
      Internetanbieter. Gute VPN-Apps tun das automatisch; prüfen können Sie es mit einem
      [DNS-Leak-Test](https://www.dnsleaktest.com).

  - id: use-a-secure-vpn-protocol
    point: Sicheres VPN-Protokoll nutzen
    priority: Optional
    details: >-
      OpenVPN und WireGuard sind quelloffene, schlanke und sichere Protokolle. Meiden Sie PPTP und SSTP.

  - id: secure-dns
    point: Verschlüsseltes DNS für alle Apps
    priority: Optional
    details: >-
      Richten Sie verschlüsseltes DNS auf Gerät oder Router ein, damit es für alle Apps gilt, nicht nur den
      Browser (Android: Einstellungen › Netzwerk › „Privates DNS“). Siehe diese
      [Liste von Anbietern und Adressen](https://adguard-dns.io/kb/de/general/dns-providers/).

  - id: avoid-the-free-router-from-your-isp
    point: Gratis-Router des Anbieters kritisch sehen
    priority: Optional
    details: >-
      Mitgelieferte Router sind oft billige Massenware mit proprietärer Firmware, die nicht regelmäßig
      Sicherheitsupdates erhält. In Deutschland gilt die Routerfreiheit – Sie dürfen ein eigenes Gerät nutzen.

  - id: whitelist-mac-addresses
    point: MAC-Adressen freigeben (Whitelist)
    priority: Optional
    details: >-
      In den Router-Einstellungen können Sie nur bekannte Geräte (MAC-Adressen) zulassen, sodass unbekannte
      Geräte sich nicht sofort verbinden können – selbst mit Passwort.

  - id: change-the-router’s-local-ip-address
    point: Lokale IP-Adresse des Routers ändern
    priority: Optional
    details: >-
      Ein bösartiges Skript im Browser kann bekannte, verwundbare Router unter ihrer Standard-IP-Adresse
      ansprechen und manipulieren. Eine ungewöhnliche lokale Adresse erschwert das.

  - id: don't-reveal-personal-info-in-ssid
    point: Keine persönlichen Infos im WLAN-Namen
    priority: Optional
    details: >-
      Wählen Sie einen WLAN-Namen (SSID), der weder Sie noch Ihre Wohnung/Adresse noch Marke und Modell des
      Routers verrät.

  - id: opt-out-router-listings
    point: Aus Router-Verzeichnissen austragen
    priority: Optional
    details: >-
      WLAN-Namen werden gescannt, gespeichert und auf Websites veröffentlicht (z. B. für Ortungsdienste).
      Hängen Sie `_nomap` an Ihren WLAN-Namen an, um Google und anderen das Erfassen zu untersagen.

  - id: disable-wps
    point: WPS deaktivieren
    priority: Optional
    details: >-
      WPS erleichtert das Verbinden ohne langes Passwort, bringt aber erhebliche Sicherheitsprobleme mit sich.

  - id: disable-upnp
    point: UPnP deaktivieren
    priority: Optional
    details: >-
      Mit UPnP können Programme selbstständig Ports am Router öffnen – das hat eine lange Geschichte
      schwerer Sicherheitsprobleme.

  - id: use-a-guest-network-for-guests
    point: Gäste-WLAN für Besuch nutzen
    priority: Optional
    details: >-
      Geben Sie Besuch nicht Ihr Haupt-WLAN, sondern ein Gäste-WLAN – sonst können deren Geräte auf Ihre
      anderen Geräte zugreifen. Das Gäste-WLAN eignet sich auch gut für Smart-Home-Geräte.

  - id: kill-unused-processes-and-services-on-your-router
    point: Unnötige Dienste auf dem Router abschalten
    priority: Optional
    details: >-
      Dienste wie Telnet und SSH, die Kommandozeilenzugriff bieten, sollten nie aus dem Internet erreichbar
      und im Heimnetz abgeschaltet sein, wenn Sie sie nicht brauchen.

  - id: don't-have-open-ports
    point: Keine offenen Ports
    priority: Optional
    details: >-
      Schließen Sie alle nicht benötigten Portfreigaben am Router – offene Ports sind ein bequemer Einstieg
      für Angreifer.

  - id: disable-unused-remote-access-protocols
    point: Ungenutzte Fernzugriffe deaktivieren
    priority: Optional
    details: >-
      Sind PING, Telnet, SSH, UPnP oder HNAP aktiv, kann Ihr Router aus der ganzen Welt abgefragt werden.

  - id: disable-cloud-based-management
    point: Cloud-Verwaltung deaktivieren
    priority: Optional
    details: >-
      Behandeln Sie die Verwaltungsoberfläche Ihres Routers mit größter Sorgfalt – wer Zugriff erhält, kann
      großen Schaden anrichten. Fernzugriff über die Cloud des Herstellers nur einschalten, wenn nötig.

  - id: manage-range-correctly
    point: Reichweite passend einstellen
    priority: Optional
    details: >-
      Volle Sendeleistung ist in einer kleinen Wohnung unnötig – wenn Ihr WLAN bis auf die Straße reicht,
      vergrößert das die Angriffsfläche.

  - id: route-all-traffic-through-tor
    point: Gesamten Verkehr über Tor leiten
    priority: Advanced
    details: >-
      VPNs haben Schwächen. Für mehr Anonymität leiten Sie Ihren gesamten Internetverkehr durch das
      [Tor](https://awesome-privacy.xyz/networking/anonymity-networks/tor)-Netzwerk.

  - id: disable-wifi-on-all-devices
    point: WLAN auf allen Geräten deaktivieren
    priority: Advanced
    details: >-
      Selbst ein sicheres WLAN vergrößert die Angriffsfläche. Konsequent ist es, das WLAN abzuschalten und
      Geräte per LAN-Kabel zu verbinden.

  - id: block-ads-network-wide-with-dns
    point: Werbung im ganzen Heimnetz per DNS blocken
    priority: Optional
    details: >-
      DNS ist das Telefonbuch des Internets. Ein eigener DNS-Filter wie
      [Pi-hole](https://pi-hole.net) oder [AdGuard Home](https://adguard.com/de/adguard-home/overview.html),
      z. B. auf einem Raspberry Pi, blockt Werbe- und Tracking-Domains für alle Geräte im Heimnetz – auch für
      Smart-TV und Apps, in denen kein Werbeblocker läuft. Grenze: DNS blockt nur Domains, aber kein
      Fingerprinting; dafür braucht es zusätzlich einen guten Browser (z. B. Brave oder Tor-Browser).
  color: violet
  softwareLinks:
  - title: VPN-Anbieter
    url: https://github.com/Lissy93/awesome-privacy#virtual-private-networks
  - title: Mix-Netzwerke
    url: https://github.com/Lissy93/awesome-privacy#mix-networks
  - title: Router-Firmware
    url: https://github.com/Lissy93/awesome-privacy#router-firmware
  - title: Quelloffene Proxys
    url: https://github.com/Lissy93/awesome-privacy#proxies
  - title: DNS-Anbieter
    url: https://github.com/Lissy93/awesome-privacy#dns
  - title: Firewalls
    url: https://github.com/Lissy93/awesome-privacy#firewalls
  - title: Netzwerk-Analyse
    url: https://github.com/Lissy93/awesome-privacy#network-analysis
  - title: Selbst gehostete Netzwerksicherheit
    url: https://github.com/Lissy93/awesome-privacy#self-hosted-network-security

- title: Smartphone & Tablet
  slug: mobile-devices
  description: Übergriffiges Tracking auf Handys und Tablets reduzieren
  icon: mobile
  intro: >
    Smartphones haben unser Leben revolutioniert und die Welt in unsere Hosentasche gebracht. Für viele
    sind sie das wichtigste Gerät für Kommunikation, Unterhaltung und Wissen. Hinter dem Bildschirm
    passiert aber einiges, das man nicht sieht.


    Standortdaten zeichnen jede Bewegung auf, und wir haben wenig Kontrolle darüber, wer sie bekommt – Ihr
    Handy kann [sogar ohne GPS geortet werden](https://gizmodo.com/how-to-track-a-cellphone-without-gps-or-consent-1821125371).
    Jedes Android-Gerät hat zudem eine Werbe-ID, über die Apps Sie geräteübergreifend wiedererkennen – oft
    ohne dass der App-Entwickler das bewusst freigegeben hat. Ein Test des norwegischen
    Verbraucherrats ergab, dass 10 Apps Daten an rund 70 Dritte weitergaben
    ([Out of Control, 2020](https://www.forbrukerradet.no/rapporter/out-of-control/)).
    Beispiele aus dem Alltag: Radio-Apps mit zahlreichen Tracking-Bausteinen, Navigations-Apps, die
    Ladenbesuche messen, Telematik-Tarife von Versicherern und Fitness-Apps, deren Heatmap 2017 den Standort
    geheimer Militärbasen verriet.


    Diese Daten werden [für weit mehr als Werbung](https://web.archive.org/web/20200517142152/https://internethealthreport.org/2018/the-good-the-bad-and-the-ugly-sides-of-data-tracking/)
    genutzt – etwa zur Bewertung bei Krediten, Versicherungen und Bewerbungen. Gezielte Werbung kann sogar
    zur Überwachung einzelner Personen dienen (siehe [ADINT](https://adint.cs.washington.edu)). Behörden
    fragen regelmäßig Daten bei Google, Apple, Meta und Co. an, teils für alle Personen in einem bestimmten
    Gebiet – [oft auch Unbeteiligte](https://www.nytimes.com/interactive/2019/04/13/us/google-location-tracking-police.html).
  checklist:
  - id: encrypt-your-device
    point: Gerät verschlüsseln
    priority: Essential
    details: >-
      Verschlüsselung schützt Ihre Daten vor physischem Zugriff: Geht das Gerät verloren oder wird es
      gestohlen, kommt niemand an Ihre Daten. Bei aktuellen Android- und iOS-Geräten ist das mit gesetzter
      Bildschirmsperre automatisch aktiv.

  - id: turn-off-connectivity-features-that-aren’t-being-used
    point: Ungenutzte Funkverbindungen ausschalten
    priority: Essential
    details: >-
      Schalten Sie WLAN, Bluetooth, NFC usw. ab, wenn Sie sie nicht nutzen. Darüber laufen verschiedene
      Angriffe, und Geräte in der Nähe (WLAN-Netze, Bluetooth-Beacons) werden zur Standortbestimmung genutzt.

  - id: keep-app-count-to-a-minimum
    point: So wenige Apps wie möglich
    priority: Essential
    details: >-
      Deinstallieren Sie Apps, die Sie nicht regelmäßig nutzen. Apps laufen oft im Hintergrund, bremsen das
      Gerät und sammeln Daten.

  - id: app-permissions
    point: App-Berechtigungen prüfen
    priority: Essential
    details: >-
      Geben Sie Apps keine Berechtigungen, die sie nicht brauchen. Ab Android 11 werden Berechtigungen
      ungenutzter Apps nach einigen Monaten automatisch entzogen; Standort, Kamera und Mikrofon lassen sich
      „nur dieses Mal“ erlauben. Mit [Bouncer](https://awesome-privacy.xyz/security-tools/mobile-apps/bouncer)
      können Sie unter Android auch andere Berechtigungen nur vorübergehend erteilen.

  - id: only-install-apps-from-official-source
    point: Apps nur aus offiziellen Quellen installieren
    priority: Essential
    details: >-
      Apps im App Store und Google Play werden geprüft und kryptografisch signiert und sind daher seltener
      bösartig. Eine seriöse quelloffene Alternative für Android ist [F-Droid](https://f-droid.org). Installieren
      Sie nie Apps über Links aus SMS oder Messenger-Nachrichten.

  - id: be-careful-of-phone-charging-threats
    point: Vorsicht an öffentlichen Ladestationen
    priority: Optional
    details: >-
      Beim „Juice Jacking“ nutzen Angreifer manipulierte USB-Ladeanschlüsse, um Schadsoftware aufzuspielen
      oder Daten abzugreifen. Nutzen Sie lieber Ihr eigenes Netzteil, eine Powerbank oder einen
      USB-Datenblocker.

  - id: set-up-a-mobile-carrier-pin
    point: Kundenkennwort beim Mobilfunkanbieter setzen
    priority: Essential
    details: >-
      Beim SIM-Swapping lassen Betrüger Ihre Rufnummer auf eine eigene SIM-Karte übertragen und empfangen so
      Ihre SMS-Codes. Schützen Sie sich, indem Sie bei Ihrem Mobilfunkanbieter ein Kundenkennwort/eine PIN
      hinterlegen, und lassen Sie die PIN Ihrer SIM-Karte aktiviert.

  - id: opt-out-of-caller-id-listings
    point: Aus Anrufer-ID-Verzeichnissen austragen
    priority: Optional
    details: >-
      Lassen Sie Ihre Nummer aus Anrufer-Erkennungs-Apps wie TrueCaller, CallApp, SyncMe und Hiya entfernen.
      Diese Apps laden oft die Adressbücher ihrer Nutzer hoch – auch Ihre Nummer.

  - id: use-offline-maps
    point: Offline-Karten nutzen
    priority: Optional
    details: >-
      Offline-Karten-Apps wie [OsmAnd](https://osmand.net) oder [Organic Maps](https://organicmaps.app)
      reduzieren den Datenabfluss. Google Maps misst z. B. Ladenbesuche für Werbekunden und wertet Ihre
      Bewegungen für Verkehrsprognosen aus.

  - id: opt-out-of-personalized-ads
    point: Werbe-ID löschen / personalisierte Werbung abschalten
    priority: Optional
    details: >-
      Ab Android 12 können Sie die Werbe-ID löschen (Einstellungen › Datenschutz › Werbung › Werbe-ID
      löschen). Unter iOS deaktivieren Sie „Apps erlauben, Tracking anzufordern“ (Datenschutz & Sicherheit ›
      Tracking) und personalisierte Werbung von Apple. Anleitung:
      [Verbraucherzentrale – App-Tracking abschalten](https://www.verbraucherzentrale.de/wissen/digitale-welt/apps-und-software/android-und-ios-apptracking-abschalten-59791).
      Auf Huawei-Geräten heißt die Kennung OAID.

  - id: erase-after-too-many-login-attempts
    point: Nach zu vielen Fehlversuchen löschen
    priority: Optional
    details: >-
      Damit niemand Ihre PIN durchprobieren kann, lassen Sie das Gerät nach zu vielen Fehlversuchen
      automatisch zurücksetzen (Backup nicht vergessen).

  - id: monitor-trackers
    point: Tracker in Apps prüfen
    priority: Optional
    details: >-
      Mit [εxodus Privacy](https://reports.exodus-privacy.eu.org/de/) können Sie jede Android-App suchen und
      sehen, welche Tracker eingebaut sind und welche Berechtigungen sie verlangt.

  - id: use-a-mobile-firewall
    point: Mobile Firewall nutzen
    priority: Optional
    details: >-
      Eine Firewall-App (z. B. NetGuard, TrackerControl) verhindert, dass Apps unerwünscht Daten senden.

  - id: reduce-background-activity
    point: Hintergrundaktivität reduzieren
    priority: Optional
    details: >-
      Unter Android kann SuperFreeze Hintergrundaktivitäten einzelner Apps komplett einfrieren.

  - id: sandbox-mobile-apps
    point: Apps in einer Sandbox isolieren
    priority: Optional
    details: >-
      Mit [Island](https://awesome-privacy.xyz/security-tools/mobile-apps/island) oder Shelter (Android)
      sperren Sie datenhungrige Apps in ein separates Arbeitsprofil ein, ohne Zugriff auf Ihre privaten Daten.

  - id: tor-traffic
    point: Verkehr über Tor leiten
    priority: Advanced
    details: >-
      [Orbot](https://awesome-privacy.xyz/security-tools/mobile-apps/orbot) bietet eine systemweite
      Tor-Verbindung und schützt vor Überwachung und Gefahren in öffentlichen WLANs.

  - id: avoid-custom-virtual-keyboards
    point: Fremde Tastatur-Apps meiden
    priority: Optional
    details: >-
      Bleiben Sie bei der vorinstallierten Tastatur. Tastatur-Apps sehen alles, was Sie tippen. Wenn eine
      fremde Tastatur, dann eine seriöse (z. B. FlorisBoard, HeliBoard).

  - id: restart-device-regularly
    point: Gerät regelmäßig neu starten
    priority: Optional
    details: >-
      Ein Neustart mindestens einmal pro Woche leert den Arbeitsspeicher und entfernt manche nicht dauerhaft
      eingenistete Schadsoftware.

  - id: mobile-avoid-sms
    point: SMS meiden
    priority: Optional
    details: >-
      Nutzen Sie SMS möglichst weder für 2FA-Codes noch für Kommunikation, sondern einen verschlüsselten
      Messenger wie [Signal](https://awesome-privacy.xyz/communication/encrypted-messaging/signal). Und
      Vorsicht vor „Smishing“: gefälschten Paket- oder Bank-SMS mit Links.

  - id: keep-your-number-private
    point: Telefonnummer privat halten
    priority: Optional
    details: >-
      Mit virtuellen Rufnummern (z. B. [MySudo](https://awesome-privacy.xyz/finance/virtual-credit-cards/mysudo)
      oder einer zweiten Prepaid-Karte) geben Sie nicht überall Ihre Hauptnummer heraus.

  - id: watch-out-for-stalkerware
    point: Auf Stalkerware achten
    priority: Optional
    details: >-
      Stalkerware wird von jemandem aus dem Umfeld direkt auf Ihr Gerät installiert. Am zuverlässigsten
      entfernen Sie sie durch Zurücksetzen auf Werkseinstellungen. Hilfe bietet die
      [Coalition Against Stalkerware](https://stopstalkerware.org/de/).

  - id: favor-the-browser,-over-dedicated-app
    point: Browser statt eigener App bevorzugen
    priority: Optional
    details: >-
      Nutzen Sie Dienste wenn möglich über einen sicheren Browser, statt für alles eine eigene App zu
      installieren – Apps haben meist mehr Zugriff und mehr Tracker.

  - id: consider-running-a-custom-rom-(android)
    point: Alternatives Android erwägen
    priority: Advanced
    details: >-
      Wenn Sie befürchten, dass der Hersteller zu viele Daten sammelt, erwägen Sie ein datenschutzorientiertes
      System wie GrapheneOS, /e/OS oder LineageOS.
  color: fuchsia
  softwareLinks:
  - title: Apps für Sicherheit & Privatsphäre
    url: https://github.com/Lissy93/awesome-privacy#mobile-apps
  - title: Verschlüsselte Messenger
    url: https://github.com/Lissy93/awesome-privacy#encrypted-messaging
