- title: Smart Home
  slug: smart-home
  description: Vernetzte Geräte nutzen, ohne die Privatsphäre zu opfern
  icon: home
  intro: >-
    Sprachassistenten (Google Home, Alexa, Siri) und andere vernetzte Geräte sammeln große Mengen
    persönlicher Daten – Sprachaufnahmen, Standort, Details zur Wohnung und Protokolle aller Interaktionen.
    Ein Beispiel aus der Datenschutzerklärung von Philips Hue: Erfasst werden Gerätedaten, Anmeldedaten,
    Standortdaten und „sonstige Informationen über Ihre Nutzung unserer Produkte“, um Produkte „durch
    Analysen zu verbessern“. Faustregel: Steht „Smart“ oder „KI“ auf einem Produkt, sammelt es Messwerte.
    Das betrifft auch Fernseher, Haushaltsgeräte, Autos sowie Fitnesstracker und Uhren.


    Sicherheit vs. Privatsphäre: Smarte Alarmanlagen, Kameras, Türschlösser und Klingeln versprechen mehr
    Sicherheit, sammeln aber viele Daten, über deren Verwendung Sie wenig Kontrolle haben – und viele
    davon lassen sich hacken.


    Am datenschutzfreundlichsten ist es, auf „smarte“ Geräte zu verzichten. Wenn Sie sie nutzen, verstehen
    Sie die Risiken vor dem Kauf und passen Sie die Einstellungen an. Die folgende Checkliste hilft dabei.
  checklist:
  - id: rename-devices-to-not-specify-brand/model
    point: Geräte ohne Marke/Modell benennen
    priority: Essential
    details: >-
      Ändern Sie Standard-Gerätenamen in etwas Neutrales, damit Angreifer nicht sofort Marke und Modell
      erkennen.

  - id: disable-microphone-and-camera-when-not-in-use
    point: Mikrofon und Kamera bei Nichtgebrauch abschalten
    priority: Essential
    details: >-
      Nutzen Sie Hardware-Schalter, um Mikrofone und Kameras smarter Geräte abzuschalten – gegen versehentliche
      Aufnahmen oder gezielten Zugriff.

  - id: understand-what-data-is-collected,-stored-and-transmitted
    point: Verstehen, welche Daten erfasst werden
    priority: Essential
    details: >-
      Informieren Sie sich vor dem Kauf (Datenschutzerklärung lesen!), welche Daten ein Gerät erfasst,
      speichert und überträgt, und meiden Sie Geräte, die Daten an Dritte weitergeben.

  - id: set-privacy-settings,-and-opt-out-of-sharing-data-with-third-parties
    point: Datenschutz einstellen, Weitergabe an Dritte ablehnen
    priority: Essential
    details: >-
      Stellen Sie in der App die strengsten Datenschutzoptionen ein und widersprechen Sie der Weitergabe an
      Dritte, wo immer möglich.

  - id: don't-link-your-smart-home-devices-to-your-real-identity
    point: Smart-Home nicht mit Ihrer echten Identität verknüpfen
    priority: Essential
    details: >-
      Nutzen Sie neutrale Benutzernamen und eigene Passwörter und melden Sie sich nicht über soziale Netzwerke
      oder andere Drittdienste an.

  - id: keep-firmware-up-to-date
    point: Firmware aktuell halten
    priority: Essential
    details: >-
      Aktualisieren Sie die Firmware smarter Geräte regelmäßig. Geräte ohne Updates sollten ersetzt werden.

  - id: protect-your-network
    point: Netzwerk schützen
    priority: Essential
    details: >-
      Sichern Sie Ihr WLAN und Heimnetz ab. Am besten kommen Smart-Home-Geräte in ein eigenes Netz (z. B. das
      Gäste-WLAN), getrennt von PC und Handy.

  - id: be-wary-of-wearables
    point: Vorsicht bei Wearables
    priority: Optional
    details: >-
      Fitnesstracker und Smartwatches erfassen Puls, Schlaf, Bewegung und Standort – sehr sensible Daten.
      Prüfen Sie, wohin diese gehen, und machen Sie Aktivitäten und Heatmaps nicht öffentlich.

  - id: don't-connect-your-home's-critical-infrastructure-to-the-internet
    point: Kritische Haustechnik nicht ans Internet hängen
    priority: Optional
    details: >-
      Wägen Sie die Risiken vernetzter Thermostate, Alarmanlagen, Türschlösser und Melder ab – Angreifer
      könnten aus der Ferne darauf zugreifen.

  - id: mitigate-alexa/-google-home-risks
    point: Risiken von Alexa/Google Home verringern
    priority: Optional
    details: >-
      Schalten Sie das Mikrofon bei vertraulichen Gesprächen stumm, löschen Sie regelmäßig gespeicherte
      Sprachaufnahmen und widersprechen Sie der Auswertung durch Mitarbeitende. Projekte wie Project Alias
      verhindern dauerhaftes Mithören.

  - id: monitor-your-home-network-closely
    point: Heimnetz im Blick behalten
    priority: Optional
    details: >-
      Prüfen Sie mit der Geräteliste Ihres Routers oder Tools wie Fing, welche Geräte verbunden sind und ob
      ungewöhnlicher Datenverkehr auftritt.

  - id: deny-internet-access-where-possible
    point: Internetzugang sperren, wo möglich
    priority: Advanced
    details: >-
      Sperren Sie Geräten, die kein Internet brauchen, per Router-Kindersicherung oder Firewall den Zugang
      und betreiben Sie sie nur lokal (z. B. mit Home Assistant).

  - id: assess-risks
    point: Risiken abwägen
    priority: Advanced
    details: >-
      Bedenken Sie die Privatsphäre aller Haushaltsmitglieder und Gäste und passen Sie Einstellungen an –
      etwa Geräte zu bestimmten Zeiten abschalten.

  - id: avoid-smart-devices-you-don't-need
    point: Unnötige smarte Geräte vermeiden
    priority: Advanced
    details: >-
      Jedes vernetzte Gerät erhöht das Risiko. Muss etwas nicht „smart“ sein, ist die normale Variante die
      sicherere Wahl.
  color: red
  softwareLinks:
  - title: Hausautomation
    url: https://github.com/Lissy93/awesome-privacy#home-automation
  - title: KI-Sprachassistenten
    url: https://github.com/Lissy93/awesome-privacy#ai-voice-assistants

- title: Finanzen
  slug: personal-finance
  description: Geld, Konten und Zahlungen schützen
  icon: finance
  intro: >-
    Betrug mit Zahlungskarten ist eine der häufigsten Formen von Identitätsdiebstahl. Laut
    Cybersicherheitsmonitor 2026 des BSI war jede zehnte Person in Deutschland im vergangenen Jahr von
    Cyberkriminalität betroffen; 88 % der Betroffenen berichten von einem Schaden, ein Drittel verliert Geld.
    Grundlegende Schutzmaßnahmen sind daher wichtiger denn je.


    Hinweis zu Kreditkarten: Kartenanbieter erkennen und stoppen manche Betrugsfälle, indem sie das
    Ausgabeverhalten ihrer Kunden sehr genau auswerten. Diese Daten dienen der Betrugserkennung, werden aber
    teils auch weitergegeben. Kreditkarten sind daher gut für die Sicherheit, aber schlecht für die
    Privatsphäre.
  checklist:
  - id: sign-up-for-fraud-alerts-and-credit-monitoring
    point: Benachrichtigungen und Kontoüberwachung aktivieren
    priority: Essential
    details: >-
      Aktivieren Sie in Ihrer Banking-App Push-Benachrichtigungen für jede Buchung bzw. Kartenzahlung, damit
      Sie verdächtige Abbuchungen sofort bemerken. Kontrollieren Sie Kontoauszüge regelmäßig und holen Sie
      einmal im Jahr Ihre kostenlose SCHUFA-Selbstauskunft (Datenkopie nach Art. 15 DSGVO) ein.

  - id: apply-a-credit-freeze
    point: Bei Verdacht sofort sperren lassen
    priority: Essential
    details: >-
      Eine „Kreditsperre“ wie in den USA gibt es in Deutschland nicht. Bei Verlust oder Missbrauch lassen Sie
      Karten und Online-Banking sofort über den Sperr-Notruf **116 116** sperren. Bei Identitätsdiebstahl:
      Anzeige bei der Polizei erstatten und die SCHUFA informieren.

  - id: use-virtual-cards
    point: Virtuelle Karten nutzen
    priority: Optional
    details: >-
      Virtuelle Kartennummern für Online-Einkäufe schützen Ihre echten Kartendaten. Viele Banken und Dienste
      bieten virtuelle oder Einmal-Karten an (z. B. Revolut, Curve; international
      [Privacy.com](https://awesome-privacy.xyz/finance/virtual-credit-cards/privacy.com)).

  - id: use-cash-for-local-transactions
    point: Vor Ort bar bezahlen
    priority: Optional
    details: >-
      Mit [Bargeld](https://awesome-privacy.xyz/finance/other-payment-methods/cash) hinterlassen Sie bei
      alltäglichen Einkäufen keine Datenspur. Auch Kundenkarten (Payback & Co.) sind vor allem
      Datensammelinstrumente.

  - id: use-cryptocurrency-for-online-transactions
    point: Kryptowährung für Online-Zahlungen
    priority: Advanced
    details: >-
      Die meisten Kryptowährungen wie Bitcoin speichern jede Transaktion öffentlich, und Börsen verknüpfen
      Käufe mit Ihrer Identität. Datenschutzorientierte Währungen wie
      [Monero](https://awesome-privacy.xyz/finance/cryptocurrencies/monero) helfen, sind aber komplizierter.

  - id: store-crypto-securely
    point: Krypto sicher aufbewahren
    priority: Advanced
    details: >-
      Bewahren Sie Kryptowährungen sicher auf – mit offline erzeugten Wallets, Hardware-Wallets wie
      [Trezor](https://awesome-privacy.xyz/finance/crypto-wallets/trezor) oder [ColdCard](https://coldcard.com),
      oder Langzeitlösungen wie [CryptoSteel](https://awesome-privacy.xyz/finance/crypto-wallets/cryptosteel).

  - id: buy-crypto-anonymously
    point: Krypto anonym kaufen
    priority: Advanced
    details: >-
      Kaufen Sie Kryptowährungen ohne Verknüpfung zu Ihrer Identität, z. B. über
      [Bisq](https://awesome-privacy.xyz/finance/crypto-exchanges/bisq).

  - id: tumble/-mix-coins
    point: Coins mischen
    priority: Advanced
    details: >-
      Nutzen Sie CoinJoin, bevor Sie Bitcoin in Geld tauschen, um Transaktionsspuren zu verschleiern
      (rechtliche Lage beachten).

  - id: use-an-alias-details-for-online-shopping
    point: Alias-Daten für Online-Shopping
    priority: Advanced
    details: >-
      Nutzen Sie beim Online-Shopping Alias-E-Mails, virtuelle Nummern und sichere Lieferwege, um Ihre
      Identität zu schützen. Prüfen Sie unbekannte Shops vorher mit dem
      [Fakeshop-Finder der Verbraucherzentrale](https://www.verbraucherzentrale.de/fakeshopfinder-71560).

  - id: use-alternate-delivery-address
    point: Alternative Lieferadresse nutzen
    priority: Advanced
    details: >-
      Lassen Sie an Packstation, Postfiliale oder Abholstelle liefern, damit Einkäufe nicht direkt mit Ihrer
      Wohnadresse verknüpft sind.
  color: purple
  softwareLinks:
